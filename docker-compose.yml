# HomeHub — self-hosted homelab control plane.
#
# Quickstart:
#   docker compose up -d
# then open http://<host>:8080 and follow the setup wizard.
#
# Optional overrides (all have working defaults):
#   POSTGRES_PASSWORD  database password (change for anything beyond a first look)
#   HOMEHUB_PORT       published port, default 8080
#
# The app encryption key is generated on first start and stored in the
# homehub-data volume at /data/master.key — back that file up.

services:
  app:
    image: homehub:latest
    build: .
    restart: unless-stopped
    ports:
      - "${HOMEHUB_PORT:-8080}:8080"
    environment:
      HOMEHUB_DATABASE_URL: postgres://homehub:${POSTGRES_PASSWORD:-homehub}@db:5432/homehub?sslmode=disable
      # The file converter runs ffmpeg/ImageMagick/libraw/pandoc on uploads
      # inside a user-namespace sandbox that cannot see /data (master.key).
      # Docker's default seccomp and AppArmor profiles block user namespaces,
      # so out of the box the media converters report "sandbox unavailable"
      # (table conversions still work). Either allow namespaces for this
      # container (security_opt below; it relaxes the container's own
      # syscall filter in exchange for per-conversion isolation), or accept
      # running the converters with access to /data:
      # HOMEHUB_CONVERT_UNSANDBOXED: "1"
    # security_opt:
    #   - seccomp=unconfined
    #   - apparmor=unconfined
    volumes:
      - homehub-data:/data
      # Uncomment to manage this host's Docker with the "socket" transport:
      # - /var/run/docker.sock:/var/run/docker.sock
      # Uncomment to give "local disk" backup targets a path on the host
      # (point the target at /backups in the app):
      # - /srv/homehub-backups:/backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homehub}
      POSTGRES_DB: homehub
    volumes:
      - homehub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehub -d homehub"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  homehub-data:
  homehub-db:
