// Forge dedicated-server adapter. Forge 1.21.9+ requires ForgeGradle 7; since
// Forge 1.20.6 the runtime uses official (mojmap) names, so the shaded jar
// needs no reobfuscation. Each targets/<mc>/ project applies FG and then
// target.gradle, which wires the shared sources and packaging.
plugins {
    id 'com.gradleup.shadow' version '9.6.1' apply false
}
