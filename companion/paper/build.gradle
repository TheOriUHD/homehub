// Paper/Spigot adapter. Compiled against spigot-api 1.13.2 — the flattening,
// where item ids became the names the inventory UI draws — so a single jar
// loads on Spigot AND Paper from 1.13 through 26.x; Paper-only extras
// (TPS/MSPT, ping) are reached via reflection.
plugins {
    id 'java'
    id 'com.gradleup.shadow'
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots/' }
}

dependencies {
    implementation project(':core')
    // 1.13.2's pom still points at a bungeecord-chat snapshot that has since
    // been swept from the repository; nothing here uses it.
    compileOnly('org.spigotmc:spigot-api:1.13.2-R0.1-SNAPSHOT') { transitive = false }
    // Provided by the server at runtime.
    compileOnly 'com.google.code.gson:gson:2.8.9'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.17.1'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand version: project.version
    }
}

shadowJar {
    archiveBaseName = 'homehub-companion-paper'
    archiveClassifier = ''
    // The websocket client must not leak its original package into the
    // server classpath — relocate it wholesale.
    relocate 'com.neovisionaries.ws', 'dev.homehub.companion.shaded.ws'
}

jar {
    enabled = false
}
build.dependsOn shadowJar
