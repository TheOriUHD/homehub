      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PveBackupJobSpec" }
      responses:
        "204":
          description: Job updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
