            application/json:
              schema: { $ref: "#/components/schemas/SSHCredentialInfo" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putSSHCredential
      summary: Store SSH access for a resource
      tags: [resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, username, authType]
              properties:
                resource: { type: string }
                host:
                  type: string
                  description: Hostname or IP; required until guest-agent address discovery lands
                port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
                username: { type: string, minLength: 1 }
                authType: { type: string, enum: [password, key] }
                secret:
                  type: string
                  description: Password or PEM private key; omit to keep the stored secret
      responses:
        "200":
          description: Stored credential metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHCredentialInfo" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteSSHCredential
      summary: Remove SSH access for a resource
      tags: [resources]
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"

  /metrics/query:
    get:
      operationId: queryMetrics
      summary: Historical metric points for one resource metric
      description: Tier (raw, 5-minute, hourly) is chosen automatically from the time span.
      tags: [metrics]
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string }
        - name: metric
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Time-ordered points
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricQueryResult" }
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: homehub_session

  parameters:
    idParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    vmidParam:
      name: vmid
      in: path
      required: true
      schema: { type: integer }

  responses:
    SessionUser:
      description: Authenticated — session cookie set
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: "#/components/schemas/User" }
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated or credentials rejected
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: The upstream system rejected or failed the request; message carries its actual error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TaskStarted:
      description: The upstream accepted the operation as an asynchronous task
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PveTaskRef" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable explanation safe to display

    User:
      type: object
      required: [id, username, displayName, status, mustChangePassword, totpEnabled, passkeyCount, roleIds, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, nullable: true }
        status: { type: string, enum: [active, disabled] }
        mustChangePassword: { type: boolean }
        totpEnabled: { type: boolean }
        passkeyCount: { type: integer }
        roleIds:
          type: array
          items: { type: string, format: uuid }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [overrides]
          properties:
            overrides:
              type: array
              items: { $ref: "#/components/schemas/Grant" }

    CreateUserResult:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
        inviteUrl:
          type: string
          nullable: true
          description: Present when onboarding is invite
        inviteExpiresAt: { type: string, format: date-time, nullable: true }
        tempPassword:
          type: string
          nullable: true
          description: Present when onboarding is temp_password — shown exactly once

    Grant:
      type: object
      required: [selector, levels, effect]
      properties:
        selector:
          type: string
          description: Resource path; matches the node and its subtree. '*' matches one segment.
        levels:
          type: array
          items: { type: string, enum: [view, control, configure, delete] }
        effect: { type: string, enum: [allow, deny] }

    GrantInput:
      type: object
      required: [selector, levels]
      properties:
        selector: { type: string, minLength: 1, maxLength: 512 }
        levels:
          type: array
          minItems: 1
          items: { type: string, enum: [view, control, configure, delete] }
        effect: { type: string, enum: [allow, deny], default: allow }

    Role:
      type: object
      required: [id, name, description, isSystem, memberCount, grants, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        isSystem: { type: boolean }
        memberCount: { type: integer }
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Me:
      type: object
      required: [user, grants]
      properties:
        user: { $ref: "#/components/schemas/User" }
        grants:
          type: array
          description: Effective grants for UI presentation. The server re-checks every request regardless.
          items: { $ref: "#/components/schemas/Grant" }
        viewAsRoleId: { type: string, format: uuid, nullable: true }

    LoginResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, mfa_required]
        user:
          $ref: "#/components/schemas/User"
        mfaToken:
          type: string
          nullable: true
          description: Short-lived token to pass to the MFA completion endpoints
        methods:
          type: array
          items: { type: string, enum: [totp, passkey, recovery] }

    WebauthnChallenge:
      type: object
      required: [challengeToken, publicKey]
      properties:
        challengeToken:
          type: string
          description: Opaque token binding this challenge to the verify call
        publicKey:
          $ref: "#/components/schemas/WebauthnPayload"

    WebauthnPayload:
      type: object
      description: Opaque WebAuthn protocol payload, passed to and from the browser credential API unmodified
      additionalProperties: true

    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        transports:
          type: array
          items: { type: string }

    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }

    SessionInfo:
      type: object
      required: [id, createdAt, lastSeenAt, expiresAt, ip, userAgent, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        ip: { type: string }
        userAgent: { type: string }
        current: { type: boolean }

    AuditEntry:
      type: object
      required: [id, ts, actorKind, actorName, action, resource, outcome, ip]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        actorKind: { type: string, enum: [user, system, agent] }
        actorId: { type: string, format: uuid, nullable: true }
        actorName: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }
        ip: { type: string }
        detail:
          type: object
          additionalProperties: true

    Notification:
      type: object
      required: [id, ts, severity, title, body, resource, eventType, read]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        severity: { type: string, enum: [info, success, warning, error] }
        title: { type: string }
        body: { type: string }
        resource: { type: string }
        eventType: { type: string }
        read: { type: boolean }

    HealthReport:
      type: object
      required: [version, uptimeSeconds, database, jobs, websocketClients, integrations]
      properties:
        version: { type: string }
        uptimeSeconds: { type: integer, format: int64 }
        database:
          type: object
          required: [reachable, sizeBytes, latencyMs]
          properties:
            reachable: { type: boolean }
            sizeBytes: { type: integer, format: int64 }
            latencyMs: { type: number }
        jobs:
          type: object
          required: [workers, active, pending, running, failedRecent]
          properties:
            workers: { type: integer }
            active: { type: integer }
            pending: { type: integer }
            running: { type: integer }
            failedRecent: { type: integer }
        websocketClients: { type: integer }
        integrations:
          type: array
          description: Health of every configured integration instance. Empty until integrations are added.
          items:
            type: object
            required: [id, type, name, status]
            properties:
              id: { type: string, format: uuid }
              type: { type: string }
              name: { type: string }
              status: { type: string, enum: [connected, degraded, unreachable] }
              lastError: { type: string, nullable: true }

    AppSettings:
      type: object
      required: [appUrl, sessionTtlHours]
      properties:
        appUrl:
          type: string
          description: External base URL, used for invite links and passkey origin validation
        sessionTtlHours: { type: integer }

    IntegrationType:
      type: object
      required: [id, name, description, secretNames]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        secretNames:
          type: array
          items: { type: string }

    Integration:
      type: object
      required: [id, type, name, config, enabled, status, statusMessage, statusChangedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        name: { type: string }
        config:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        statusChangedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    TestConnectionResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        detail:
          type: object
          additionalProperties: true

    PveGuestAction:
      type: string
      enum: [start, stop, shutdown, reboot, suspend, resume]

    PveTaskRef:
      type: object
      required: [upid, node]
      properties:
        upid: { type: string }
        node: { type: string }

    PveSummary:
      type: object
      required: [clusterName, quorate, nodes, storageUsedBytes, storageTotalBytes]
      properties:
        clusterName: { type: string }
        quorate: { type: boolean, nullable: true }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PveNode" }
        storageUsedBytes: { type: integer, format: int64 }
        storageTotalBytes: { type: integer, format: int64 }

    PveNode:
      type: object
      required: [name, status, cpu, maxCpu, memBytes, maxMemBytes, uptimeSeconds]
      properties:
        name: { type: string }
        status: { type: string }
        cpu:
          type: number
          description: Load as a 0..1 fraction of all cores
        maxCpu: { type: integer }
        memBytes: { type: integer, format: int64 }
        maxMemBytes: { type: integer, format: int64 }
        uptimeSeconds: { type: integer, format: int64 }
        pveVersion: { type: string }

    PveGuest:
      type: object
      required: [vmid, name, kind, node, status, cpu, maxCpu, memBytes, maxMemBytes, diskBytes, maxDiskBytes, uptimeSeconds, template]
      properties:
        vmid: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [qemu, lxc] }
        node: { type: string }
        status: { type: string }
        cpu: { type: number }
        maxCpu: { type: integer }
        memBytes: { type: integer, format: int64 }
        maxMemBytes: { type: integer, format: int64 }
        diskBytes: { type: integer, format: int64 }
        maxDiskBytes: { type: integer, format: int64 }
        uptimeSeconds: { type: integer, format: int64 }
        template: { type: boolean }
        tags: { type: string }

    PveGuestDetail:
      type: object
      required: [guest, config]
      properties:
        guest: { $ref: "#/components/schemas/PveGuest" }
        config:
          type: object
          description: Raw Proxmox configuration keys as the API reports them
          additionalProperties: true

    PveSnapshot:
      type: object
      required: [name, description, vmstate]
      properties:
        name: { type: string }
        description: { type: string }
        snaptime: { type: string, format: date-time, nullable: true }
        vmstate: { type: boolean }

    PveTask:
      type: object
      required: [upid, node, type, id, user, running, startTime]
      properties:
        upid: { type: string }
        node: { type: string }
        type: { type: string }
        id: { type: string }
        user: { type: string }
        running: { type: boolean }
        exitStatus: { type: string, nullable: true }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time, nullable: true }

    PveTaskDetail:
      type: object
      required: [task, lines]
      properties:
        task: { $ref: "#/components/schemas/PveTask" }
        lines:
          type: array
          items: { type: string }

    PveStorage:
      type: object
      required: [storage, node, type, content, active, usedBytes, totalBytes]
      properties:
        storage: { type: string }
        node: { type: string }
        type: { type: string }
        content: { type: string }
        active: { type: boolean }
        usedBytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }

    PveBackupJob:
      type: object
      required: [id, schedule, storage, mode, enabled, vmids]
      properties:
        id: { type: string }
        schedule: { type: string }
        storage: { type: string }
        mode: { type: string }
        enabled: { type: boolean }
        vmids:
          type: string
          description: Comma-separated vmid list, or empty for all

    PveBackupJobSpec:
      type: object
      required: [schedule, storage, vmids]
      properties:
        schedule:
          type: string
          description: Proxmox calendar event, e.g. "02:30" or "sat 03:00"
        storage: { type: string }
        mode: { type: string, enum: [snapshot, suspend, stop], default: snapshot }
        enabled: { type: boolean, default: true }
        vmids: { type: string }

    PveBulkResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [vmid]
            properties:
              vmid: { type: integer }
              upid: { type: string, nullable: true }
              error: { type: string, nullable: true }

    TermSession:
      type: object
      required: [sessionId, wsPath]
      properties:
        sessionId: { type: string }
        wsPath:
          type: string
          description: One-time WebSocket path, valid for 30 seconds
        credential:
          type: string
          nullable: true
          description: For VNC sessions, the one-time password noVNC must answer RFB authentication with

    SSHCredentialInfo:
      type: object
      required: [resource, host, port, username, authType, updatedAt]
      properties:
        resource: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        authType: { type: string, enum: [password, key] }
        updatedAt: { type: string, format: date-time }

    MetricQueryResult:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items:
            type: object
            required: [ts, avg, min, max]
            properties:
              ts: { type: string, format: date-time }
              avg: { type: number }
              min: { type: number }
              max: { type: number }
