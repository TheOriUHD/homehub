        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [heater, target]
              properties:
                heater: { type: string, description: "The Klipper heater object, e.g. \"extruder\", \"heater_bed\", \"heater_generic chamber\"" }
                target: { type: number, description: "Target °C; 0 turns the heater off" }
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /moonraker/{id}/print:
    post:
      operationId: moonrakerPrintAction
      summary: Pause, resume, or cancel the active print
      tags: [moonraker]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [pause, resume, cancel] }
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /moonraker/{id}/estop:
    post:
      operationId: moonrakerEstop
      summary: Emergency stop (halts the printer immediately)
      tags: [moonraker]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204":
          description: Halted
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /moonraker/{id}/firmware-restart:
    post:
      operationId: moonrakerFirmwareRestart
      summary: Restart Klipper firmware (recover from a shutdown/error)
      tags: [moonraker]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204":
          description: Restarting
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /moonraker/{id}/webcam:
    post:
      operationId: moonrakerSetWebcam
      summary: Persist a camera's display settings (flip H/V, rotation)
      description: >-
        Writes the per-camera display flags back through Moonraker so they stick
        and stay in sync with the printer's other UIs. Horizontal and vertical
        flip are independent. Requires control on the instance.
      tags: [moonraker]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: the camera's name }
                flipHorizontal: { type: boolean }
                flipVertical: { type: boolean }
                rotation: { type: integer, enum: [0, 90, 180, 270] }
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /patchpilot/{id}/hosts:
    get:
      operationId: patchpilotHosts
      summary: List hosts in a fleet
      tags: [patchpilot]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      responses:
        "200":
          description: Hosts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PatchpilotHost" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /patchpilot/{id}/hosts/detect:
    post:
      operationId: patchpilotDetect
      summary: Probe a host over SSH before onboarding
      tags: [patchpilot]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchpilotHostCredential" }
      responses:
        "200":
          description: Detection result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotDetectResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patchpilot/{id}/hosts/onboard:
    post:
      operationId: patchpilotOnboard
      summary: Bootstrap and add a host (streams steps over WS)
      tags: [patchpilot]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchpilotOnboardInput" }
      responses:
        "201":
          description: Host onboarded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotHost" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /patchpilot/{id}/hosts/{hostId}:
    get:
      operationId: patchpilotHost
      summary: One host
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      responses:
        "200":
          description: Host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotHost" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: patchpilotUpdateHost
      summary: Update a host's mutable fields
      description: >-
        `hostname` and `sshPort` are accepted for a manual host only — a bound
        host takes its address from its registry entry (unbind it first, or
        edit the entry). The pinned host key stays, so a new address must still
        be the same machine.
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                hostname: { type: string }
                sshPort: { type: integer, minimum: 1, maximum: 65535 }
                enabled: { type: boolean }
                autoReboot: { type: boolean }
                critical: { type: boolean }
                notes: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotHost" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: patchpilotDeleteHost
      summary: Remove a host from the fleet
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /patchpilot/{id}/hosts/{hostId}/binding:
    put:
      operationId: patchpilotBindHost
      summary: Bind a host to an SSH registry entry, or unbind it
      description: >-
        A bound host is dialed at the registry entry's address from the next
        connection on, and bootstrap re-runs use the entry's credential. Runs
        keep using the dedicated patchpilot account and the fleet key.
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchpilotHostBinding" }
      responses:
        "200":
          description: Updated host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotHost" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patchpilot/{id}/hosts/{hostId}/rebootstrap:
    post:
      operationId: patchpilotRebootstrapHost
      summary: Run the bootstrap again on a known host (streams steps over WS)
      description: >-
        Re-establishes the managed account, the fleet key with its source-address
        pin, and the sudoers rule — the repair after HomeHub's address changed or
        a host was reinstalled. The pinned host key is verified, never replaced.
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchpilotRebootstrapInput" }
      responses:
        "200":
          description: Host set up again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotHost" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /patchpilot/{id}/hosts/{hostId}/dry-run:
    post:
      operationId: patchpilotDryRun
      summary: Check for available updates without applying them
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      responses:
        "200":
          description: Dry-run result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotDryRunResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /patchpilot/{id}/hosts/{hostId}/run:
    post:
      operationId: patchpilotRunHost
      summary: Update one host now
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /patchpilot/{id}/hosts/{hostId}/reboot:
    post:
      operationId: patchpilotRebootHost
      summary: Reboot a host (explicit)
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      responses:
        "200": { description: Reboot issued }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /patchpilot/{id}/hosts/{hostId}/repair-sudoers:
    post:
      operationId: patchpilotRepairSudoers
      summary: Rewrite the least-privilege sudoers rule
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      responses:
        "200": { description: Repaired }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /patchpilot/{id}/hosts/{hostId}/runs:
    get:
      operationId: patchpilotHostRuns
      summary: A host's recent run slices
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      responses:
        "200":
          description: Host runs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PatchpilotHostRun" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /patchpilot/{id}/publickey:
    get:
      operationId: patchpilotPublicKey
      summary: The fleet's orchestrator public key (for manual installs)
      tags: [patchpilot]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      responses:
        "200":
          description: Public key
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties: { publicKey: { type: string } }
        "404": { $ref: "#/components/responses/NotFound" }

  /patchpilot/{id}/run:
    post:
      operationId: patchpilotRun
      summary: Update hosts now (all enabled, or a selection)
      tags: [patchpilot]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hostIds: { type: array, items: { type: string, format: uuid } }
                suppressReboot: { type: boolean }
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotRun" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /patchpilot/{id}/runs:
    get:
      operationId: patchpilotRuns
      summary: Run history
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PatchpilotRun" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /patchpilot/{id}/runs/{runId}:
    get:
      operationId: patchpilotRunDetail
      summary: One run with its per-host slices
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotRunDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patchpilot/{id}/runs/{runId}/abort:
    post:
      operationId: patchpilotAbortRun
      summary: Abort an in-progress run
      description: Cancels the active host's command and short-circuits the rest. Requires control on the fleet.
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Abort requested }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patchpilot/{id}/runs/{runId}/hosts/{hostId}/skip:
    post:
      operationId: patchpilotSkipHost
      summary: Skip one host in an in-progress run
      description: >-
        A queued host is never started; a host whose command is in flight has
        HomeHub stop waiting for it (the package manager on the host keeps
        running until it finishes). The run moves on to the next host either
        way. Requires control on the fleet.
      tags: [patchpilot]
      parameters:
        - { $ref: "#/components/parameters/idParam" }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/patchpilotHostIdParam" }
      responses:
        "202": { description: Skip requested }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

