              required: [vmids, action]
              properties:
                vmids:
                  type: array
                  minItems: 1
                  items: { type: integer }
                action: { $ref: "#/components/schemas/PveGuestAction" }
      responses:
        "200":
          description: Per-guest outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PveBulkResult" }
        "404":
          $ref: "#/components/responses/NotFound"

