      operationId: patchpilotCreateSchedule
      summary: Create a schedule
      tags: [patchpilot]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchpilotScheduleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PatchpilotSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /patchpilot/{id}/schedules/{scheduleId}:
    put:
      operationId: patchpilotUpdateSchedule
      summary: Update a schedule
