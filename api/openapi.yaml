            application/json:
              schema: { $ref: "#/components/schemas/TruenasStats" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /moonraker/{id}/snapshot:
    get:
      operationId: moonrakerSnapshot
      summary: Full live printer state (dynamically discovered)
      description: >-
        The complete dashboard snapshot — Klippy state, print job, motion, and
        every heater, sensor, fan, LED, output pin and macro the printer
        exposes. The set is discovered from Klipper, so it varies per machine.
      tags: [moonraker]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MoonrakerSnapshot" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /moonraker/{id}/gcode:
    post:
      operationId: moonrakerGcode
      summary: Run a G-code script (macro, homing, fan/LED command, console)
      description: The universal control surface — the dashboard composes macro, fan, LED and homing commands here. Requires control on the instance.
      tags: [moonraker]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                script: { type: string, description: "A G-code line, e.g. \"G28\", \"M106 S128\", or a macro name" }
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /moonraker/{id}/temperature:
    post:
      operationId: moonrakerSetTemperature
