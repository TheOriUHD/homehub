      operationId: getCalendarFeed
      summary: Whether the calendar is published as a subscription feed, and its URL
      tags: [calendar]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Feed state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarFeed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: publishCalendarFeed
      summary: Publish the calendar as an iCalendar subscription URL (or rotate the URL)
      description: >-
        The URL is the whole credential: anyone holding it can read the
        calendar, which is what lets a phone, Google Calendar or Home Assistant
        subscribe without an account. Calling again replaces the token, so the
        old URL stops working.
      tags: [calendar]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarFeed" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: unpublishCalendarFeed
      summary: Stop publishing; the URL stops working at once
      tags: [calendar]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Unpublished }
        "404": { $ref: "#/components/responses/NotFound" }
