      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/vmidParam"
      responses:
        "200":
          description: Snapshots, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PveSnapshot" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
    post:
      operationId: pveCreateSnapshot
      summary: Take a snapshot
      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/vmidParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]*$", maxLength: 40 }
                description: { type: string, maxLength: 512 }
                vmstate: { type: boolean, default: false }
      responses:
        "200":
          $ref: "#/components/responses/TaskStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

