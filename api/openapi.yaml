      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/vmidParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [vnc, serial] }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermSession" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /proxmox/{id}/guests/{vmid}/ssh:
    post:
      operationId: pveOpenSSH
      summary: Open an SSH terminal to the guest
      description: Uses the SSH credential stored for this guest (see /resources/ssh). 400 when none is configured.
      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/vmidParam"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermSession" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /proxmox/{id}/bulk:
