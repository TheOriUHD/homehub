        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /proxmox/{id}/backup-jobs/{jobId}:
    put:
      operationId: pveUpdateBackupJob
