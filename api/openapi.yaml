        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TruenasOverview" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /truenas/{id}/datasets:
    get:
      operationId: truenasDatasets
