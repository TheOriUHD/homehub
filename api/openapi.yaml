      tags: [truenas]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Datasets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TruenasDataset" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /truenas/{id}/shares:
    get:
      operationId: truenasShares
      summary: SMB, NFS, and iSCSI shares
      tags: [truenas]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Shares
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TruenasShare" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /truenas/{id}/snapshots:
    get:
      operationId: truenasSnapshots
      summary: Recent ZFS snapshots
      tags: [truenas]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Snapshots, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TruenasSnapshot" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /truenas/{id}/alerts:
    get:
      operationId: truenasAlerts
      summary: Active system alerts
      tags: [truenas]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Alerts
          content:
            application/json:
