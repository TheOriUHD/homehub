      tags: [truenas]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TruenasOverview" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /truenas/{id}/datasets:
    get:
      operationId: truenasDatasets
      summary: Datasets and zvols
      tags: [truenas]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Datasets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TruenasDataset" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /truenas/{id}/shares:
    get:
      operationId: truenasShares
      summary: SMB, NFS, and iSCSI shares
      tags: [truenas]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Shares
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TruenasShare" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /truenas/{id}/snapshots:
    get:
      operationId: truenasSnapshots
      summary: Recent ZFS snapshots
      tags: [truenas]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Snapshots, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TruenasSnapshot" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /truenas/{id}/alerts:
    get:
      operationId: truenasAlerts
      summary: Active system alerts
      tags: [truenas]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TruenasAlert" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /amp/instances:
    get:
      operationId: ampListInstances
      summary: All AMP panels with instance counts
      tags: [amp]
      responses:
        "200":
          description: Visible panels
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AmpPanel" }

  /amp/{id}/overview:
    get:
      operationId: ampOverview
      summary: Targets and game-server instances with live state and metrics
      description: The panel dashboard — every ADS target with its platform, and every instance with state, players, CPU, and memory. Instances are filtered to what the caller may view.
      tags: [amp]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmpOverview" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /amp/{id}/instances/{instanceId}/status:
    get:
      operationId: ampInstanceStatus
      summary: Live state, uptime, and metrics for one instance
      tags: [amp]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmpInstanceStatus" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /amp/{id}/instances/{instanceId}/console:
    get:
      operationId: ampConsole
      summary: Console scrollback
      description: Lines after a sequence number, oldest first. Reading starts a live poller against the instance; fresh lines also push on the WS topic's console events.
      tags: [amp]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          description: Return lines with seq greater than this; -1 (default) starts at the oldest held line
          schema: { type: integer, format: int64, default: -1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "200":
          description: Console lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AmpConsole" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /amp/{id}/instances/{instanceId}/command:
    post:
      operationId: ampCommand
      summary: Send a console command
      description: Dispatches the command to the instance's console. AMP gives no per-command verdict — success or failure appears in the console stream. Audited.
      tags: [amp]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "204":
          description: Dispatched
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /amp/{id}/instances/{instanceId}/app:
    post:
      operationId: ampAppAction
      summary: Control the application inside an instance
      description: Start, stop, restart, kill, or update the game server the instance runs. Audited.
      tags: [amp]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [start, stop, restart, kill, update]
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /amp/{id}/instances/{instanceId}/lifecycle:
    post:
      operationId: ampInstanceAction
      summary: Control the instance itself through the controller
      description: Start, stop, or restart the whole AMP instance (the container/process, not just the application). Audited.
      tags: [amp]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [start, stop, restart]
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ts/instances:
    get:
      operationId: tsListInstances
      summary: All Tailscale tailnets with device counts
      tags: [tailscale]
      responses:
        "200":
          description: Visible tailnets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TsTailnet" }

  /ts/{id}/devices:
    get:
      operationId: tsDevices
      summary: Every device in the tailnet
      description: The device inventory with connectivity, versions, tags, and subnet routes, filtered to devices the caller may view.
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TsDevice" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ts/{id}/devices/{deviceId}/authorized:
    post:
      operationId: tsSetAuthorized
      summary: Authorize or deauthorize a device
      description: Audited.
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorized]
              properties:
                authorized: { type: boolean }
      responses:
        "204":
          description: Applied
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ts/{id}/devices/{deviceId}/routes:
    post:
      operationId: tsSetRoutes
      summary: Replace a device's enabled subnet routes
      description: Audited. Routes not in the device's advertised list may be pre-enabled.
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routes]
              properties:
                routes:
                  type: array
                  items: { type: string }
      responses:
        "204":
          description: Applied
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ts/{id}/devices/{deviceId}/key:
    post:
      operationId: tsSetKeyExpiry
      summary: Enable or disable key expiry for a device
      description: Audited.
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyExpiryDisabled]
              properties:
                keyExpiryDisabled: { type: boolean }
      responses:
        "204":
          description: Applied
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ts/{id}/devices/{deviceId}/expire:
    post:
      operationId: tsExpireKey
      summary: Expire a device's node key now
      description: Forces the device to re-authenticate. Audited.
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Expired
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ts/{id}/devices/{deviceId}:
    delete:
      operationId: tsDeleteDevice
      summary: Remove a device from the tailnet
      description: Audited.
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ts/{id}/keys:
    get:
      operationId: tsKeys
      summary: Auth keys in the tailnet
      description: Key secrets are never included — they are shown exactly once, at creation.
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TsKey" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
    post:
      operationId: tsCreateKey
      summary: Mint an auth key
      description: The response carries the key secret exactly once. Audited.
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string, maxLength: 200 }
                expiryDays: { type: integer, minimum: 1, maximum: 365 }
                reusable: { type: boolean }
                ephemeral: { type: boolean }
                preauthorized: { type: boolean }
                tags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Created key, secret included once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TsCreatedKey" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ts/{id}/keys/{keyId}:
    delete:
      operationId: tsRevokeKey
      summary: Revoke an auth key
      description: Audited.
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ts/{id}/dns:
    get:
      operationId: tsDns
      summary: Tailnet DNS settings
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: DNS settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TsDns" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
    put:
      operationId: tsSetDns
      summary: Replace tailnet DNS settings
      description: Nameservers, MagicDNS, and search domains in one write. Audited.
      tags: [tailscale]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TsDns" }
      responses:
        "204":
          description: Applied
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /caddy/pair:
    post:
      operationId: caddyPair
      summary: Pair a caddy-reader helper and create the integration
      description: Redeems a six-digit pairing code server-side — the helper token never touches the browser — and creates the Caddy system in one step. Audited.
      tags: [caddy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, baseUrl, code]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                baseUrl: { type: string, minLength: 1 }
                code: { type: string, minLength: 6, maxLength: 7 }
      responses:
        "201":
          description: Paired and created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /caddy/{id}/repair:
    post:
      operationId: caddyRepair
      summary: Re-pair an existing helper with a fresh code
      description: Replaces the stored token. Audited.
      tags: [caddy]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 7 }
      responses:
        "204":
          description: Re-paired
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /caddy/{id}/sites:
    get:
      operationId: caddySites
      summary: The manager state, read live from the Caddyfile
      description: No cache, ever — the Caddyfile is the source of truth. Editable entries, the blocks the splitter refused to model (shown with their reasons), the global options block, and whether the helper allows writes.
      tags: [caddy]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Manager state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaddySitesState" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
    post:
      operationId: caddyCreateSite
      summary: Add a site
      description: Caddy validates the resulting file before anything touches disk; a refused config is a non-event. Returns the whole re-listed state. Audited.
      tags: [caddy]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaddySiteInput" }
      responses:
        "200":
          description: Saved and reloaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaddySitesState" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /caddy/{id}/sites/{domain}:
    put:
      operationId: caddyUpdateSite
      summary: Change the site serving a domain
      description: Unknown directives in the block are carried across — changing a port never drops the line above it. Audited.
      tags: [caddy]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: domain
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaddySiteInput" }
      responses:
        "200":
          description: Saved and reloaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaddySitesState" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/UpstreamError"
    delete:
      operationId: caddyRemoveSite
      summary: Remove the site serving a domain
      description: Audited.
      tags: [caddy]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: domain
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed and reloaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaddySitesState" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /caddy/{id}/served:
    get:
      operationId: caddyServed
      summary: What the running config is actually serving
      description: The helper's projected running config — which domain points at which upstream, domains that are proxied somewhere unknowable (with reasons), and domains served by something that is not a reverse proxy.
      tags: [caddy]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Served domains
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaddyServed" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /nvr/{id}/overview:
    get:
      operationId: apertureOverview
      summary: Cameras with health and storage, plus system throughput
      description: Served from HomeHub's backend cache (Aperture has no CORS and a per-token rate budget). Cameras are filtered to what the caller may view; RTSP credentials never leave the backend.
      tags: [aperture]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApertureOverview" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /nvr/{id}/cameras/{cameraId}/stream-token:
    post:
      operationId: apertureStreamToken
      summary: Mint a short-lived live-stream grant for one camera
      description: Exchanges HomeHub's long-lived token for a five-minute, single-camera token and returns the absolute WebSocket URL the browser connects to — directly to Aperture, never proxied.
      tags: [aperture]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: cameraId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stream grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApertureStreamGrant" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ha/instances:
    get:
      operationId: haListInstances
      summary: All Home Assistant instances
      description: Every enabled Home Assistant instance the caller may see, with live overview data when connected.
      tags: [homeassistant]
      responses:
        "200":
          description: Visible instances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HaInstance" }

  /ha/{id}/dashboard:
    get:
      operationId: haGetDashboard
      summary: The caller's dashboard for this instance
      description: Per-user board layout; empty card list until the user saves one.
      tags: [homeassistant]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: The layout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HaDashboard" }
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: haPutDashboard
      summary: Save the caller's dashboard
      tags: [homeassistant]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HaDashboard" }
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /ha/{id}/entities:
    get:
      operationId: haListEntities
      summary: Entities with live state
      description: The joined registry + state view, filtered to entities the caller may view. Areas the caller cannot see any entity in are absent from the area list.
      tags: [homeassistant]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: domain
          in: query
          description: Restrict to one domain, e.g. light
          schema: { type: string }
      responses:
        "200":
          description: Entities and the areas they resolve to
          content:
            application/json:
              schema:
                type: object
                required: [entities, areas]
                properties:
                  entities:
                    type: array
                    items: { $ref: "#/components/schemas/HaEntity" }
                  areas:
                    type: array
                    items: { $ref: "#/components/schemas/HaArea" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ha/{id}/entities/{entityId}:
    get:
      operationId: haGetEntity
      summary: One entity
      tags: [homeassistant]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/haEntityId"
      responses:
        "200":
          description: The entity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HaEntity" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /ha/{id}/entities/{entityId}/service:
    post:
      operationId: haCallService
      summary: Call a service on an entity
      description: Invokes a service in the entity's own domain (light.turn_on, climate.set_temperature, automation.trigger, …). Requires control on the entity; the upstream service error is surfaced verbatim on failure.
      tags: [homeassistant]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/haEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HaServiceCall" }
      responses:
        "204":
          description: Service call accepted by Home Assistant
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /mc/{id}/overview:
    get:
      operationId: mcOverview
      summary: Minecraft network overview
      description: Every server in the network with its connection state, metadata, live snapshot and players; whether SSH is configured; and (for configure-level callers) the pending pairing code.
      tags: [minecraft]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: The overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McOverview" }
        "404":
          $ref: "#/components/responses/NotFound"

  /mc/{id}/pairing-code:
    post:
      operationId: mcCreatePairingCode
      summary: Issue a fresh pairing code for a new server
      description: Generates a new 6-digit code valid for 15 minutes, replacing any outstanding code. Redeeming it adds a server with the given label to the network; the companion then authenticates with its own token.
      tags: [minecraft]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80 }
      responses:
        "200":
          description: The code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McPairingCode" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mc/{id}/servers/{serverId}:
    patch:
      operationId: mcUpdateServer
      summary: Rename a server or move it to another network
      description: Moving reseals the companion's token under the destination network — no re-pairing. Requires configure on both networks. Audited.
      tags: [minecraft]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/mcServerIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, minLength: 1, maxLength: 80 }
                networkId:
                  type: string
                  format: uuid
                  description: Destination network (another minecraft system)
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: mcDeleteServer
      summary: Remove a server from the network
      description: Unpairs it — the companion's token dies with the row. Audited.
      tags: [minecraft]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/mcServerIdParam"
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mc/{id}/servers/{serverId}/console:
    get:
      operationId: mcConsole
      summary: Console scrollback for one server
      description: Lines after a sequence number, oldest first. The buffer holds the full scrollback from server start (backfilled from the server's own log); poll with nextSeq or ride the WS topic's console events for live lines.
      tags: [minecraft]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/mcServerIdParam"
        - name: after
          in: query
          description: Return lines with seq greater than this; -1 (default) starts at the oldest held line
          schema: { type: integer, format: int64, default: -1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 }
      responses:
        "200":
          description: Console lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McConsole" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /mc/{id}/servers/{serverId}/command:
    post:
      operationId: mcCommand
      summary: Execute a console command on one server
      description: Runs the command on the server's main thread and reports the companion's acknowledgment. Audited.
      tags: [minecraft]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/mcServerIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /mc/{id}/servers/{serverId}/start:
    post:
      operationId: mcStartServer
      summary: Start one stopped server over SSH
      description: Launches the server from its own start.sh (detached) if it is not already running. Requires the network's SSH access and control on the server. Audited.
      tags: [minecraft]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/mcServerIdParam"
      responses:
        "200":
          description: Outcome with the script output
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /mc/{id}/servers/{serverId}/stop:
    post:
      operationId: mcStopServer
      summary: Stop one running server over SSH
      description: Sends the stop command into the server's screen console and waits for it to exit. Requires the network's SSH access and control on the server. Audited.
      tags: [minecraft]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/mcServerIdParam"
      responses:
        "200":
          description: Outcome with the script output
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }

  /mc/{id}/servers/{serverId}/restart:
    post:
      operationId: mcRestartServer
      summary: Full restart of one server over SSH
      description: Sends the stop command into the server's screen console, waits for it to exit, then relaunches from the server's own start.sh (transformed to detached mode; start.sh is never modified). Requires the network's SSH access and control on the server. Audited.
      tags: [minecraft]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/mcServerIdParam"
      responses:
        "200":
          description: Restart outcome with the script's output
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /mc/{id}/ssh/test:
    post:
      operationId: mcSshTest
      summary: Test the network's SSH credential
      description: Runs a trivial command over the stored SSH access and reports the outcome verbatim. Requires configure. Audited.
      tags: [minecraft]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Test outcome
          content:
            application/json:
              schema:
                type: object
                required: [ok, message]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /mc/downloads:
    get:
      operationId: mcDownloads
      summary: Companion plugin downloads
      description: The companion builds shipped inside this HomeHub, one per loader, with the Minecraft versions each supports.
      tags: [minecraft]
      responses:
        "200":
          description: Available builds
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/McDownload" }

  /mc/downloads/{file}:
    get:
      operationId: mcDownloadFile
      summary: Download a companion build
      tags: [minecraft]
      parameters:
        - name: file
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9._-]+\\.jar$" }
      responses:
        "200":
          description: The jar
          content:
            application/java-archive:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"

  /backups/targets:
    get:
      operationId: listBackupTargets
      summary: Backup storage targets
      tags: [backups]
      responses:
        "200":
          description: Configured targets with live capacity where known
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupTarget" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createBackupTarget
      summary: Add a backup target
      description: Adding a target validates and connects immediately — no restart, no interruption.
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupTargetInput" }
      responses:
        "201":
          description: Created target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /backups/targets/test:
    post:
      operationId: testBackupTargetConfig
      summary: Test a target configuration before saving
      description: Connects and performs a write/read-back/delete probe.
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, config]
              properties:
                type: { type: string, enum: [local, smb, nfs, s3] }
                config:
                  type: object
                  additionalProperties: true
                secrets:
                  type: object
                  additionalProperties: { type: string }
      responses:
        "200":
          description: Probe outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestConnectionResult" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /backups/targets/{id}:
    patch:
      operationId: updateBackupTarget
      summary: Update a backup target
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupTargetInput" }
      responses:
        "200":
          description: Updated target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupTarget" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBackupTarget
      summary: Remove a backup target
      description: Stored archives on the target are left untouched.
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /backups/targets/{id}/test:
    post:
      operationId: testBackupTarget
      summary: Re-test a stored target
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Probe outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestConnectionResult" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /backups/targets/{id}/run:
    post:
      operationId: runBackupNow
      summary: Run an application backup to this target now
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "202":
          $ref: "#/components/responses/JobQueued"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /backups/targets/{id}/archives:
    get:
      operationId: listBackupArchives
      summary: Restore points stored on a target
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Archives, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupArchive" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /backups/targets/{id}/archives/inspect:
    post:
      operationId: inspectBackupArchive
      summary: Read an archive's manifest
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
      responses:
        "200":
          description: Archive manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupManifest" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /backups/restore:
    post:
      operationId: restoreBackup
      summary: Restore the application from an archive
      description: Replaces the current database with the archive's contents and restarts HomeHub. Everything created since that backup is lost. The confirm flag must be true.
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, path, confirm]
              properties:
                targetId: { type: string, format: uuid }
                path: { type: string }
                confirm: { type: boolean }
      responses:
        "202":
          $ref: "#/components/responses/JobQueued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /backups/runs:
    get:
      operationId: listBackupRuns
      summary: Backup and restore history
      tags: [backups]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupRun" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /backups/schedules:
    get:
      operationId: listBackupSchedules
      summary: Scheduled application backups
      tags: [backups]
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BackupSchedule" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createBackupSchedule
      summary: Schedule recurring application backups to a target
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, cron]
              properties:
                targetId: { type: string, format: uuid }
                cron:
                  type: string
                  description: Standard 5-field cron expression
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSchedule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /backups/schedules/{id}:
    patch:
      operationId: updateBackupSchedule
      summary: Update a backup schedule
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cron, enabled]
              properties:
                cron: { type: string }
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSchedule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteBackupSchedule
      summary: Delete a backup schedule
      tags: [backups]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /backups/encryption-key:
    get:
      operationId: getBackupEncryptionKey
      summary: Export the backup encryption key
      description: The age identity that decrypts encrypted archives. Store it safely offline — without it (and outside this installation) encrypted backups are unreadable. The export is audited.
      tags: [backups]
      responses:
        "200":
          description: The age identity string
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /metrics/series:
    get:
      operationId: listMetricSeries
      summary: Catalog of recorded metric series
      description: Filtered to resources the caller may view — the history picker's data source.
      tags: [metrics]
      responses:
        "200":
          description: Available series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetricSeriesInfo" }

  /alerts:
    get:
      operationId: listAlertRules
      summary: Alert rules visible to the caller
      tags: [alerts]
      responses:
        "200":
          description: Rules on resources the caller may view
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlertRule" }
    post:
      operationId: createAlertRule
      summary: Create an alert rule
      tags: [alerts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /alerts/{id}:
    patch:
      operationId: updateAlertRule
      summary: Update an alert rule
      tags: [alerts]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRule" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteAlertRule
      summary: Delete an alert rule
      tags: [alerts]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /channels:
    get:
      operationId: listChannels
      summary: Outbound notification channels
      tags: [notifications]
      responses:
        "200":
          description: Configured channels (secrets never returned)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createChannel
      summary: Add an outbound channel
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "201":
          description: Created channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /channels/{id}:
    patch:
      operationId: updateChannel
      summary: Update an outbound channel
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelInput" }
      responses:
        "200":
          description: Updated channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteChannel
      summary: Remove an outbound channel
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /channels/{id}/test:
    post:
      operationId: testChannel
      summary: Send a test notification through a channel
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Delivery outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestConnectionResult" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /notification-prefs:
    get:
      operationId: getNotificationPrefs
      summary: The caller's notification routing preferences
      tags: [notifications]
      responses:
        "200":
          description: Event types, current preferences, and subscribable channels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPrefs" }
    put:
      operationId: putNotificationPref
      summary: Set routing for one event type
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType, inapp, channelIds]
              properties:
                eventType: { type: string }
                inapp: { type: boolean }
                channelIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"

  /assistant:
    get:
      operationId: getAssistant
      summary: Assistant availability and configuration
      tags: [assistant]
      responses:
        "200":
          description: Assistant state. keySet says whether an API key is stored (never the key).
          content:
            application/json:
              schema:
                type: object
                required: [enabled, provider, model, baseUrl, keySet, keysSet, canConfigure, providers]
                properties:
                  enabled: { type: boolean }
                  provider: { type: string }
                  model: { type: string }
                  baseUrl: { type: string }
                  keySet: { type: boolean }
                  keysSet:
                    type: array
                    description: Provider ids that have a stored API key — switching providers keeps each key sealed in its own slot.
                    items: { type: string }
                  canConfigure: { type: boolean }
                  providers:
                    type: array
                    description: The selectable provider catalog with per-provider defaults.
                    items:
                      type: object
                      required: [id, label, kind, requiresKey, defaultModel]
                      properties:
                        id: { type: string }
                        label: { type: string }
                        kind: { type: string, enum: [cloud, local] }
                        requiresKey: { type: boolean }
                        defaultModel: { type: string }
                        defaultBaseUrl: { type: string }
                        modelHint: { type: string }

  /assistant/settings:
    put:
      operationId: putAssistantSettings
      summary: Configure the assistant
      description: Requires configure on system/settings. An empty apiKey keeps the stored one. Audited.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, provider, model]
              properties:
                enabled: { type: boolean }
                provider: { type: string, minLength: 1, maxLength: 40 }
                model: { type: string, minLength: 1, maxLength: 200 }
                baseUrl: { type: string, maxLength: 300 }
                apiKey: { type: string, maxLength: 512 }
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /assistant/discover:
    post:
      operationId: assistantDiscover
      summary: Scan attached networks for LM Studio instances
      description: Probes the host's directly attached /24 networks (and loopback) for LM Studio's unauthenticated /v1/models on port 1234. Requires configure on system/settings.
      tags: [assistant]
      responses:
        "200":
          description: Discovered instances (empty when none answered)
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances:
                    type: array
                    items:
                      type: object
                      required: [baseUrl, models]
                      properties:
                        baseUrl: { type: string }
                        models:
                          type: array
                          items: { type: string }
                        requiresKey:
                          type: boolean
                          description: The server answered but demands an API key.
        "403":
          $ref: "#/components/responses/Forbidden"

  /assistant/verify-endpoint:
    post:
      operationId: assistantVerifyEndpoint
      summary: Verify an OpenAI-compatible endpoint URL
      description: Asks the URL for its model list and reports what happened in actionable terms. Requires configure on system/settings.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl]
              properties:
                baseUrl: { type: string, minLength: 1, maxLength: 300 }
                provider:
                  type: string
                  maxLength: 40
                  description: Use this provider's stored API key for the probe.
                apiKey:
                  type: string
                  maxLength: 512
                  description: Probe with this not-yet-saved key instead of the stored one. Never returned.
      responses:
        "200":
          description: Verification result — ok with models, or a diagnosis
          content:
            application/json:
              schema:
                type: object
                required: [ok, models]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  models:
                    type: array
                    items: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /assistant/chat:
    post:
      operationId: assistantChat
      summary: Send one message to the assistant
      description: Runs the tool loop under the caller's own permissions and returns the final reply. Audited with the tools used.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: The assistant's reply
          content:
            application/json:
              schema:
                type: object
                required: [reply, tools]
                properties:
                  reply: { type: string }
                  tools:
                    type: array
                    items: { type: string }
                  steps:
                    type: array
                    description: Tool invocations this turn, inputs included — the UI builds action chips from these.
                    items: { $ref: "#/components/schemas/AssistantStep" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Assistant disabled or not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          $ref: "#/components/responses/UpstreamError"

  /assistant/history:
    get:
      operationId: getAssistantHistory
      summary: The caller's conversation history
      tags: [assistant]
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, role, content, ts]
                  properties:
                    id: { type: integer, format: int64 }
                    role: { type: string, enum: [user, assistant] }
                    content: { type: string }
                    tools:
                      type: array
                      items: { type: string }
                    steps:
                      type: array
                      items: { $ref: "#/components/schemas/AssistantStep" }
                    ts: { type: string, format: date-time }
    delete:
      operationId: clearAssistantHistory
      summary: Clear the caller's conversation
      tags: [assistant]
      responses:
        "204":
          description: Cleared

  /prefs/{key}:
    get:
      operationId: getUserPref
      summary: The caller's saved preference document for one surface
      tags: [account]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[a-z][a-z0-9-]*$" }
      responses:
        "200":
          description: The stored document, or null when never saved
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value:
                    type: object
                    additionalProperties: true
                    nullable: true
    put:
      operationId: putUserPref
      summary: Save the caller's preference document for one surface
      tags: [account]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[a-z][a-z0-9-]*$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: object
                  additionalProperties: true
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"

  /metrics/query:
    get:
      operationId: queryMetrics
      summary: Historical metric points for one resource metric
      description: Tier (raw, 5-minute, hourly) is chosen automatically from the time span.
      tags: [metrics]
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string }
        - name: metric
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Time-ordered points
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricQueryResult" }
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: homehub_session

  parameters:
    mcServerIdParam:
      name: serverId
      in: path
      required: true
      schema: { type: string, format: uuid }
    idParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    haEntityId:
      name: entityId
      in: path
      required: true
      description: Home Assistant entity id, e.g. light.kitchen
      schema: { type: string, pattern: "^[a-z0-9_]+\\.[a-z0-9_]+$" }
    dbNameParam:
      name: database
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    dbObjectParam:
      name: object
      in: path
      required: true
      description: Table name (SQL) or collection name (MongoDB)
      schema: { type: string, minLength: 1, maxLength: 128 }
    vmidParam:
      name: vmid
      in: path
      required: true
      schema: { type: integer }
    containerName:
      name: name
      in: path
      required: true
      schema: { type: string }

  responses:
    SessionUser:
      description: Authenticated — session cookie set
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: "#/components/schemas/User" }
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated or credentials rejected
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: The upstream system rejected or failed the request; message carries its actual error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TaskStarted:
      description: The upstream accepted the operation as an asynchronous task
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PveTaskRef" }
    JobQueued:
      description: Queued as a background job; the outcome arrives as a notification
      content:
        application/json:
          schema:
            type: object
            required: [jobId]
            properties:
              jobId: { type: integer, format: int64 }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable explanation safe to display

    User:
      type: object
      required: [id, username, displayName, status, mustChangePassword, totpEnabled, passkeyCount, roleIds, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, nullable: true }
        status: { type: string, enum: [active, disabled] }
        mustChangePassword: { type: boolean }
        totpEnabled: { type: boolean }
        passkeyCount: { type: integer }
        roleIds:
          type: array
          items: { type: string, format: uuid }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [overrides]
          properties:
            overrides:
              type: array
              items: { $ref: "#/components/schemas/Grant" }

    CreateUserResult:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
        inviteUrl:
          type: string
          nullable: true
          description: Present when onboarding is invite
        inviteExpiresAt: { type: string, format: date-time, nullable: true }
        tempPassword:
          type: string
          nullable: true
          description: Present when onboarding is temp_password — shown exactly once

    Grant:
      type: object
      required: [selector, levels, effect]
      properties:
        selector:
          type: string
          description: Resource path; matches the node and its subtree. '*' matches one segment.
        levels:
          type: array
          items: { type: string, enum: [view, control, configure, delete] }
        effect: { type: string, enum: [allow, deny] }

    GrantInput:
      type: object
      required: [selector, levels]
      properties:
        selector: { type: string, minLength: 1, maxLength: 512 }
        levels:
          type: array
          minItems: 1
          items: { type: string, enum: [view, control, configure, delete] }
        effect: { type: string, enum: [allow, deny], default: allow }

    Role:
      type: object
      required: [id, name, description, isSystem, memberCount, grants, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        isSystem: { type: boolean }
        memberCount: { type: integer }
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Me:
      type: object
      required: [user, grants]
      properties:
        user: { $ref: "#/components/schemas/User" }
        grants:
          type: array
          description: Effective grants for UI presentation. The server re-checks every request regardless.
          items: { $ref: "#/components/schemas/Grant" }
        viewAsRoleId: { type: string, format: uuid, nullable: true }

    LoginResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, mfa_required]
        user:
          $ref: "#/components/schemas/User"
        mfaToken:
          type: string
          nullable: true
          description: Short-lived token to pass to the MFA completion endpoints
        methods:
          type: array
          items: { type: string, enum: [totp, passkey, recovery] }

    WebauthnChallenge:
      type: object
      required: [challengeToken, publicKey]
      properties:
        challengeToken:
          type: string
          description: Opaque token binding this challenge to the verify call
        publicKey:
          $ref: "#/components/schemas/WebauthnPayload"

    WebauthnPayload:
      type: object
      description: Opaque WebAuthn protocol payload, passed to and from the browser credential API unmodified
      additionalProperties: true

    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        transports:
          type: array
          items: { type: string }

    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }

    SessionInfo:
      type: object
      required: [id, createdAt, lastSeenAt, expiresAt, ip, userAgent, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        ip: { type: string }
        userAgent: { type: string }
        current: { type: boolean }

    AuditEntry:
      type: object
      required: [id, ts, actorKind, actorName, action, resource, outcome, ip]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        actorKind: { type: string, enum: [user, system, agent] }
        actorId: { type: string, format: uuid, nullable: true }
        actorName: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }
        ip: { type: string }
        detail:
          type: object
          additionalProperties: true

    Notification:
      type: object
      required: [id, ts, severity, title, body, resource, eventType, read]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        severity: { type: string, enum: [info, success, warning, error] }
        title: { type: string }
        body: { type: string }
        resource: { type: string }
        eventType: { type: string }
        read: { type: boolean }

    HealthReport:
      type: object
      required: [version, uptimeSeconds, database, jobs, websocketClients, integrations]
      properties:
        version: { type: string }
        uptimeSeconds: { type: integer, format: int64 }
        database:
          type: object
          required: [reachable, sizeBytes, latencyMs]
          properties:
            reachable: { type: boolean }
            sizeBytes: { type: integer, format: int64 }
            latencyMs: { type: number }
        jobs:
          type: object
          required: [workers, active, pending, running, failedRecent]
          properties:
            workers: { type: integer }
            active: { type: integer }
            pending: { type: integer }
            running: { type: integer }
            failedRecent: { type: integer }
        websocketClients: { type: integer }
        integrations:
          type: array
          description: Health of every configured integration instance. Empty until integrations are added.
          items:
            type: object
            required: [id, type, name, status]
            properties:
              id: { type: string, format: uuid }
              type: { type: string }
              name: { type: string }
              status: { type: string, enum: [connected, degraded, unreachable] }
              lastError: { type: string, nullable: true }

    AssistantStep:
      type: object
      required: [tool]
      properties:
        tool: { type: string }
        input:
          type: object
          additionalProperties: true
        isError: { type: boolean }

    AppSettings:
      type: object
      required: [appUrl, sessionTtlHours, metricsRawRetentionHours, metrics5mRetentionDays, metrics1hRetentionDays]
      properties:
        appUrl:
          type: string
          description: External base URL, used for invite links and passkey origin validation
        sessionTtlHours: { type: integer }
        metricsRawRetentionHours: { type: integer }
        metrics5mRetentionDays: { type: integer }
        metrics1hRetentionDays: { type: integer }

    BackupTarget:
      type: object
      required: [id, type, name, config, retentionDays, encrypt, enabled, status, statusMessage]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [local, smb, nfs, s3] }
        name: { type: string }
        config:
          type: object
          additionalProperties: true
        retentionDays: { type: integer }
        encrypt: { type: boolean }
        enabled: { type: boolean }
        status: { type: string, enum: [unknown, ok, error] }
        statusMessage: { type: string }
        capacity:
          type: object
          nullable: true
          required: [unknown]
          properties:
            totalBytes: { type: integer, format: int64 }
            freeBytes: { type: integer, format: int64 }
            unknown: { type: boolean }

    BackupTargetInput:
      type: object
      required: [type, name, config]
      properties:
        type: { type: string, enum: [local, smb, nfs, s3] }
        name: { type: string, minLength: 1, maxLength: 128 }
        config:
          type: object
          additionalProperties: true
        secrets:
          type: object
          description: Only provided keys are replaced
          additionalProperties: { type: string }
        retentionDays: { type: integer, minimum: 1, maximum: 3650, default: 30 }
        encrypt: { type: boolean, default: false }
        enabled: { type: boolean, default: true }

    BackupArchive:
      type: object
      required: [path, sizeBytes, modTime, encrypted]
      properties:
        path: { type: string }
        sizeBytes: { type: integer, format: int64 }
        modTime: { type: string, format: date-time }
        encrypted: { type: boolean }

    BackupManifest:
      type: object
      required: [version, createdAt, kind, dumpFormat, encrypted]
      properties:
        version: { type: string }
        createdAt: { type: string, format: date-time }
        kind: { type: string }
        dumpFormat: { type: string }
        encrypted: { type: boolean }

    BackupRun:
      type: object
      required: [id, targetName, kind, status, filePath, sizeBytes, error, startedAt]
      properties:
        id: { type: integer, format: int64 }
        targetId: { type: string, format: uuid, nullable: true }
        targetName: { type: string }
        kind: { type: string, enum: [app-backup, restore, prune] }
        status: { type: string, enum: [running, succeeded, failed] }
        filePath: { type: string }
        sizeBytes: { type: integer, format: int64 }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }

    BackupSchedule:
      type: object
      required: [id, targetId, targetName, cron, enabled]
      properties:
        id: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        targetName: { type: string }
        cron: { type: string }
        enabled: { type: boolean }
        lastRunAt: { type: string, format: date-time, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }

    MetricSeriesInfo:
      type: object
      required: [resource, metric, unit]
      properties:
        resource: { type: string }
        metric: { type: string }
        unit: { type: string }

    AlertRule:
      type: object
      required: [id, name, resource, metric, operator, threshold, sustainedSeconds, severity, enabled, state, stateChangedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        resource: { type: string }
        metric: { type: string }
        operator: { type: string, enum: [gt, lt] }
        threshold: { type: number }
        sustainedSeconds: { type: integer }
        severity: { type: string, enum: [info, warning, error] }
        enabled: { type: boolean }
        state: { type: string, enum: [ok, firing, unknown] }
        stateChangedAt: { type: string, format: date-time }

    AlertRuleInput:
      type: object
      required: [name, resource, metric, operator, threshold, sustainedSeconds, severity]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        resource: { type: string, minLength: 1 }
        metric: { type: string, minLength: 1 }
        operator: { type: string, enum: [gt, lt] }
        threshold: { type: number }
        sustainedSeconds: { type: integer, minimum: 30, maximum: 86400 }
        severity: { type: string, enum: [info, warning, error] }
        enabled: { type: boolean, default: true }

    Channel:
      type: object
      required: [id, type, name, config, enabled, secretNames]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [webhook, email, ntfy, gotify, telegram, discord] }
        name: { type: string }
        config:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        secretNames:
          type: array
          items: { type: string }

    ChannelInput:
      type: object
      required: [type, name, config]
      properties:
        type: { type: string, enum: [webhook, email, ntfy, gotify, telegram, discord] }
        name: { type: string, minLength: 1, maxLength: 128 }
        config:
          type: object
          additionalProperties: true
        secrets:
          type: object
          description: Only provided keys are replaced
          additionalProperties: { type: string }
        enabled: { type: boolean, default: true }

    ChannelRef:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }

    NotificationPrefs:
      type: object
      required: [eventTypes, prefs, channels]
      properties:
        eventTypes:
          type: array
          items: { type: string }
        prefs:
          type: array
          items:
            type: object
            required: [eventType, inapp, channelIds]
            properties:
              eventType: { type: string }
              inapp: { type: boolean }
              channelIds:
                type: array
                items: { type: string, format: uuid }
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelRef" }

    IntegrationType:
      type: object
      required: [id, name, description, secretNames]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        secretNames:
          type: array
          items: { type: string }

    Integration:
      type: object
      required: [id, type, name, config, enabled, status, statusMessage, statusChangedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        name: { type: string }
        config:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        statusChangedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    TestConnectionResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        detail:
          type: object
          additionalProperties: true

    PveGuestAction:
      type: string
      enum: [start, stop, shutdown, reboot, suspend, resume]

    PveTaskRef:
      type: object
      required: [upid, node]
      properties:
        upid: { type: string }
        node: { type: string }

    PveSummary:
      type: object
      required: [clusterName, quorate, nodes, storageUsedBytes, storageTotalBytes]
      properties:
        clusterName: { type: string }
        quorate: { type: boolean, nullable: true }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PveNode" }
        storageUsedBytes: { type: integer, format: int64 }
        storageTotalBytes: { type: integer, format: int64 }

    PveNode:
      type: object
      required: [name, status, cpu, maxCpu, memBytes, maxMemBytes, uptimeSeconds]
      properties:
        name: { type: string }
        status: { type: string }
        cpu:
          type: number
          description: Load as a 0..1 fraction of all cores
        maxCpu: { type: integer }
        memBytes: { type: integer, format: int64 }
        maxMemBytes: { type: integer, format: int64 }
        uptimeSeconds: { type: integer, format: int64 }
        pveVersion: { type: string }

    PveGuest:
      type: object
      required: [vmid, name, kind, node, status, cpu, maxCpu, memBytes, maxMemBytes, diskBytes, maxDiskBytes, uptimeSeconds, template]
      properties:
        vmid: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [qemu, lxc] }
        node: { type: string }
        status: { type: string }
        cpu: { type: number }
        maxCpu: { type: integer }
        memBytes: { type: integer, format: int64 }
        maxMemBytes: { type: integer, format: int64 }
        diskBytes: { type: integer, format: int64 }
        maxDiskBytes: { type: integer, format: int64 }
        uptimeSeconds: { type: integer, format: int64 }
        template: { type: boolean }
        tags: { type: string }

    PveGuestDetail:
      type: object
      required: [guest, config]
      properties:
        guest: { $ref: "#/components/schemas/PveGuest" }
        config:
          type: object
          description: Raw Proxmox configuration keys as the API reports them
          additionalProperties: true

    PveSnapshot:
      type: object
      required: [name, description, vmstate]
      properties:
        name: { type: string }
        description: { type: string }
        snaptime: { type: string, format: date-time, nullable: true }
        vmstate: { type: boolean }

    PveGuestAgent:
      type: object
      required: [available, interfaces]
      properties:
        available: { type: boolean }
        reason:
          type: string
          description: Why the agent is unavailable, when it is
        hostname: { type: string }
        os: { type: string }
        interfaces:
          type: array
          items:
            type: object
            required: [name, addresses]
            properties:
              name: { type: string }
              mac: { type: string }
              addresses:
                type: array
                items:
                  type: object
                  required: [address, type]
                  properties:
                    address: { type: string }
                    type: { type: string, enum: [ipv4, ipv6] }
                    prefix: { type: integer }

    PveTask:
      type: object
      required: [upid, node, type, id, user, running, startTime]
      properties:
        upid: { type: string }
        node: { type: string }
        type: { type: string }
        id: { type: string }
        user: { type: string }
        running: { type: boolean }
        exitStatus: { type: string, nullable: true }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time, nullable: true }

    PveTaskDetail:
      type: object
      required: [task, lines]
      properties:
        task: { $ref: "#/components/schemas/PveTask" }
        lines:
          type: array
          items: { type: string }

    PveStorage:
      type: object
      required: [storage, node, type, content, active, usedBytes, totalBytes]
      properties:
        storage: { type: string }
        node: { type: string }
        type: { type: string }
        content: { type: string }
        active: { type: boolean }
        usedBytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }

    PveBackupJob:
      type: object
      required: [id, schedule, storage, mode, enabled, vmids]
      properties:
        id: { type: string }
        schedule: { type: string }
        storage: { type: string }
        mode: { type: string }
        enabled: { type: boolean }
        vmids:
          type: string
          description: Comma-separated vmid list, or empty for all

    PveBackupJobSpec:
      type: object
      required: [schedule, storage, vmids]
      properties:
        schedule:
          type: string
          description: Proxmox calendar event, e.g. "02:30" or "sat 03:00"
        storage: { type: string }
        mode: { type: string, enum: [snapshot, suspend, stop], default: snapshot }
        enabled: { type: boolean, default: true }
        vmids: { type: string }

    PveBulkResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [vmid]
            properties:
              vmid: { type: integer }
              upid: { type: string, nullable: true }
              error: { type: string, nullable: true }

    TermSession:
      type: object
      required: [sessionId, wsPath]
      properties:
        sessionId: { type: string }
        wsPath:
          type: string
          description: One-time WebSocket path, valid for 30 seconds
        credential:
          type: string
          nullable: true
          description: For VNC sessions, the one-time password noVNC must answer RFB authentication with

    SSHCredentialInfo:
      type: object
      required: [resource, host, port, username, authType, updatedAt]
      properties:
        resource: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        authType: { type: string, enum: [password, key] }
        updatedAt: { type: string, format: date-time }

    DockerContainer:
      type: object
      required: [id, name, image, state, status, created]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        imageId: { type: string }
        state: { type: string }
        status: { type: string }
        created: { type: string, format: date-time }
        composeProject: { type: string, nullable: true }
        composeService: { type: string, nullable: true }
        ports:
          type: array
          items:
            type: object
            required: [private, type]
            properties:
              private: { type: integer }
              public: { type: integer, nullable: true }
              type: { type: string }

    DockerContainerDetail:
      type: object
      required: [container, env, mounts, networks, labels, cmd]
      properties:
        container: { $ref: "#/components/schemas/DockerContainer" }
        env:
          type: array
          items: { type: string }
        mounts:
          type: array
          items:
            type: object
            required: [type, destination, rw]
            properties:
              type: { type: string }
              source: { type: string }
              destination: { type: string }
              rw: { type: boolean }
        networks:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              ipAddress: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        restartPolicy: { type: string }
        cmd: { type: string }
        entrypoint: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        exitCode: { type: integer, nullable: true }

    DockerImage:
      type: object
      required: [id, tags, sizeBytes, created, dangling, inUse]
      properties:
        id: { type: string }
        tags:
          type: array
          items: { type: string }
        sizeBytes: { type: integer, format: int64 }
        created: { type: string, format: date-time }
        dangling: { type: boolean }
        inUse: { type: boolean }

    DockerUpdateCheck:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [reference, updateAvailable]
            properties:
              reference: { type: string }
              updateAvailable: { type: boolean }
              message: { type: string, nullable: true }

    DockerPruneResult:
      type: object
      required: [reclaimedBytes, deleted]
      properties:
        reclaimedBytes: { type: integer, format: int64 }
        deleted: { type: integer }

    DockerVolume:
      type: object
      required: [name, driver, mountpoint, inUse]
      properties:
        name: { type: string }
        driver: { type: string }
        mountpoint: { type: string }
        created: { type: string, nullable: true }
        inUse: { type: boolean }

    DockerNetwork:
      type: object
      required: [id, name, driver, scope, containers, builtin]
      properties:
        id: { type: string }
        name: { type: string }
        driver: { type: string }
        scope: { type: string }
        containers: { type: integer }
        builtin:
          type: boolean
          description: bridge/host/none — cannot be removed

    DockerStack:
      type: object
      required: [project, services]
      properties:
        project: { type: string }
        services:
          type: array
          items:
            type: object
            required: [service, containers]
            properties:
              service: { type: string }
              containers:
                type: array
                items: { $ref: "#/components/schemas/DockerContainer" }

    DockerRegistryCred:
      type: object
      required: [registry, username]
      properties:
        registry: { type: string }
        username: { type: string }

    DnsListType:
      type: string
      enum: [allow, deny, allow_regex, deny_regex, custom]

    DnsCapabilities:
      type: object
      required: [groupCrud, clientCrud, regexLists, customRules, listComment]
      properties:
        groupCrud: { type: boolean }
        clientCrud: { type: boolean }
        regexLists: { type: boolean }
        customRules: { type: boolean }
        listComment: { type: boolean }

    DnsStats:
      type: object
      required: [queriesToday, blockedToday, blockedPct, clientsSeen, domainsOnLists, enabled, version]
      properties:
        queriesToday: { type: integer, format: int64 }
        blockedToday: { type: integer, format: int64 }
        blockedPct: { type: number }
        clientsSeen: { type: integer, format: int64 }
        domainsOnLists: { type: integer, format: int64 }
        enabled: { type: boolean }
        disabledUntil: { type: string, format: date-time, nullable: true }
        version: { type: string }

    DnsBlocking:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        until: { type: string, format: date-time, nullable: true }

    DbObjectSchema:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [table, collection]
        columns:
          type: array
          description: SQL tables
          items: { $ref: "#/components/schemas/DbColumn" }
        primaryKey:
          type: array
          items: { type: string }
        indexes:
          type: array
          items: { $ref: "#/components/schemas/DbIndex" }
        sampleKeys:
          type: array
          description: MongoDB — keys sampled from recent documents
          items: { type: string }
        rowEstimate: { type: integer, format: int64 }

    DbColumn:
      type: object
      required: [name, type, nullable, isPrimaryKey]
      properties:
        name: { type: string }
        type: { type: string }
        nullable: { type: boolean }
        key: { type: string }
        default: { type: string, nullable: true }
        extra: { type: string }
        isPrimaryKey: { type: boolean }

    DbIndex:
      type: object
      required: [name, unique, columns]
      properties:
        name: { type: string }
        unique: { type: boolean }
        columns:
          type: array
          items: { type: string }

    DbDataPage:
      type: object
      required: [kind, total, limit]
      properties:
        kind:
          type: string
          enum: [rows, documents]
        columns:
          type: array
          description: SQL column order for the rows
          items: { type: string }
        rows:
          type: array
          description: SQL rows; each cell is a string or null (SQL NULL)
          items:
            type: array
            items: { type: string, nullable: true }
        documents:
          type: array
          description: MongoDB documents as extended JSON strings
          items: { type: string }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
        durationMs: { type: number, format: double }

    DbRowWrite:
      type: object
      description: >-
        Engine-tagged write payload. SQL insert uses `values` (column→string|null);
        SQL update/delete also send `identity` (original key values). MongoDB insert
        uses `document`; update/delete use `id` (the _id as extended JSON) and update
        also sends `document` (the full replacement).
      properties:
        values:
          type: object
          additionalProperties: { type: string, nullable: true }
        identity:
          type: object
          additionalProperties: { type: string, nullable: true }
        document: { type: string }
        id: { type: string }

    DbInstance:
      type: object
      required: [id, name, engine, status, statusMessage]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        engine:
          type: string
          enum: [mysql, mongodb]
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        host:
          type: string
          description: The configured upstream address
        connectionUser:
          type: string
          description: The username HomeHub connects with — shown beside the console so it is clear whose privileges statements run under
        stats:
          allOf:
            - $ref: "#/components/schemas/DbStats"
          nullable: true

    DbStats:
      type: object
      required: [version]
      properties:
        version: { type: string }
        flavor:
          type: string
          description: MySQL or MariaDB for SQL engines, absent for MongoDB
        uptimeSeconds: { type: integer, format: int64 }
        connectionsCurrent: { type: integer, format: int64 }
        connectionsMax: { type: integer, format: int64 }
        opsPerSec:
          type: number
          format: double
          description: Queries per second (SQL) or operations per second (MongoDB), delta-derived
        slowQueriesTotal:
          type: integer
          format: int64
          description: SQL engines only
        memResidentMb:
          type: integer
          format: int64
          description: MongoDB only

    DbDatabase:
      type: object
      required: [name, sizeBytes, objectCount]
      properties:
        name: { type: string }
        sizeBytes: { type: integer, format: int64 }
        objectCount:
          type: integer
          format: int64
          description: Tables (SQL) or collections (MongoDB)

    DbObject:
      type: object
      required: [name, kind, rows, sizeBytes]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [table, collection]
        engine:
          type: string
          description: Storage engine, SQL tables only
        rows:
          type: integer
          format: int64
          description: Estimated rows or documents
        sizeBytes: { type: integer, format: int64 }

    DbSession:
      type: object
      required: [id, client, command, timeSec]
      properties:
        id: { type: integer, format: int64 }
        user: { type: string }
        client: { type: string }
        database: { type: string }
        command: { type: string }
        timeSec: { type: integer, format: int64 }
        state: { type: string }
        query: { type: string }

    DbQueryResult:
      type: object
      required: [columns, rows, rowsAffected, truncated, durationMs]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: { type: string }
        rowsAffected: { type: integer, format: int64 }
        truncated: { type: boolean }
        durationMs: { type: number, format: double }

    McOverview:
      type: object
      required: [servers, sshConfigured]
      properties:
        servers:
          type: array
          items: { $ref: "#/components/schemas/McServer" }
        sshConfigured:
          type: boolean
          description: Whether the network has SSH host access stored
        pendingPairing:
          allOf:
            - $ref: "#/components/schemas/McPairingCode"
          nullable: true
          description: Present only for configure-level callers while a code is outstanding

    McServer:
      type: object
      required: [id, label, connected]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        serverName: { type: string }
        loader:
          type: string
          description: paper, spigot, velocity, fabric, or forge
        mcVersion: { type: string }
        companionVersion: { type: string }
        pairedAt: { type: string, format: date-time }
        lastConnectedAt: { type: string, format: date-time }
        remoteIp: { type: string }
        connected: { type: boolean }
        status:
          allOf:
            - $ref: "#/components/schemas/McStatus"
          nullable: true
        players:
          type: array
          items: { $ref: "#/components/schemas/McPlayer" }

    McStatus:
      type: object
      required: [playersOnline, playersMax]
      properties:
        tps: { type: number, format: double }
        mspt: { type: number, format: double }
        playersOnline: { type: integer }
        playersMax: { type: integer }
        heapUsedMb: { type: number, format: double }
        heapMaxMb: { type: number, format: double }
        downstream:
          type: array
          description: Backends behind a Velocity proxy
          items:
            type: object
            required: [name, players]
            properties:
              name: { type: string }
              players: { type: integer }

    McPlayer:
      type: object
      required: [name]
      properties:
        name: { type: string }
        uuid: { type: string }

    McPairingCode:
      type: object
      required: [code, expiresAt]
      properties:
        code: { type: string }
        expiresAt: { type: string, format: date-time }
        label: { type: string, description: The name the new server will wear }

    McConsole:
      type: object
      required: [lines, oldestSeq, nextSeq, connected]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/McConsoleLine" }
        oldestSeq:
          type: integer
          format: int64
          description: Sequence of the oldest line still held — history before this has been evicted
        nextSeq:
          type: integer
          format: int64
          description: Pass as `after` on the next poll
        connected: { type: boolean }

    McConsoleLine:
      type: object
      required: [seq, ts, text]
      properties:
        seq: { type: integer, format: int64 }
        ts:
          type: integer
          format: int64
          description: Server-side unix milliseconds
        level: { type: string }
        text: { type: string }

    McDownload:
      type: object
      required: [loader, file, sizeBytes, mcVersions]
      properties:
        loader: { type: string }
        file: { type: string }
        sizeBytes: { type: integer, format: int64 }
        mcVersions:
          type: string
          description: Human-readable supported range, e.g. "1.16.5 – 1.21.x"

    ApertureCamera:
      type: object
      required: [id, name, enabled, recordMode, sortOrder, recordingExpected, recordingOk, liveOk, coveragePercent, watchdogStale, restartsToday]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        recordMode: { type: string }
        sortOrder: { type: integer }
        recordingExpected:
          type: boolean
          description: Whether this camera is supposed to record at all — live-only cameras are healthy without footage.
        recordingOk: { type: boolean }
        liveOk: { type: boolean }
        coveragePercent: { type: integer }
        watchdogStale: { type: boolean }
        restartsToday: { type: integer }
        lastSegmentTs:
          type: integer
          format: int64
          description: Epoch milliseconds.
        storageBytes: { type: integer, format: int64 }
        oldestTs:
          type: integer
          format: int64
          description: Epoch milliseconds — start of this camera's retained history.
        newestTs: { type: integer, format: int64 }

    ApertureOverview:
      type: object
      required: [baseUrl, cameras, bitrate]
      properties:
        baseUrl:
          type: string
          description: The Aperture origin, for the link out.
        cameras:
          type: array
          items: { $ref: "#/components/schemas/ApertureCamera" }
        capBytes: { type: integer, format: int64 }
        bitrate:
          type: array
          items:
            type: object
            required: [ts, bps]
            properties:
              ts: { type: integer, format: int64 }
              bps: { type: integer, format: int64 }

    ApertureStreamGrant:
      type: object
      required: [wsUrl, hasSub]
