    post:
      operationId: caddyDnsCreate
      summary: Create a DNS record in the linked zone
      description: >-
        Name accepts "@" (zone apex), a bare subdomain, or a full name. Content
        defaults to the link's configured target; type auto-detects from the
        content (IPv4 → A, IPv6 → AAAA, hostname → CNAME) when omitted.
        Requires control on the instance. Audited.
      tags: [caddy]
      parameters:
        - $ref: "#/components/parameters/idParam"
