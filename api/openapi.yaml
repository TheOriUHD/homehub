      summary: Compare list entries between two instances
      description: Diffs normalized entries (custom rules excluded) so redundant resolvers don't drift.
      tags: [dns]
      parameters:
        - name: a
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: b
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Entries unique to each side
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsCompareResult" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /dns/sync:
    post:
      operationId: dnsSync
      summary: Copy list entries from one instance to another
      tags: [dns]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, entries]
              properties:
                from: { type: string, format: uuid }
                to: { type: string, format: uuid }
                entries:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/DnsListInput" }
      responses:
        "200":
          description: Per-entry outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DnsSyncResult" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /resources/ssh:
    get:
      operationId: getSSHCredential
      summary: SSH credential metadata for a resource
      description: The secret itself is never returned.
      tags: [resources]
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stored credential metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHCredentialInfo" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putSSHCredential
      summary: Store SSH access for a resource
      tags: [resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, username, authType]
              properties:
                resource: { type: string }
                host:
                  type: string
                  description: Hostname or IP; required until guest-agent address discovery lands
                port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
                username: { type: string, minLength: 1 }
                authType: { type: string, enum: [password, key] }
                secret:
                  type: string
                  description: Password or PEM private key; omit to keep the stored secret
                hostId:
                  type: string
                  format: uuid
                  nullable: true
                  description: >-
                    Bind this resource to a central SSH host instead of storing
                    its own credential. When set, host/username/authType/secret
                    are ignored and the registry entry is used. Null unbinds.
      responses:
        "200":
          description: Stored credential metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHCredentialInfo" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteSSHCredential
      summary: Remove SSH access for a resource
      tags: [resources]
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"

  /ssh-hosts:
    get:
      operationId: listSSHHosts
      summary: The central SSH host registry
      description: Named SSH machines reused across HomeHub. Secrets are never returned.
      tags: [ssh]
      responses:
        "200":
          description: Hosts, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SSHHost" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createSSHHost
      summary: Add an SSH host
      tags: [ssh]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHHostInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHHost" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /ssh-hosts/provision:
    post:
      operationId: provisionSSHHost
      summary: Set up key authentication in one step
      description: >-
        Generates an ed25519 keypair, installs the public half into the
        account's authorized_keys using the password supplied once, verifies
        the key actually authenticates, then stores the host with key auth.
        The password is used for this call only and never stored. Pass id to
        convert an existing entry instead of creating one.
      tags: [ssh]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname, username, password]
              properties:
                id:
                  type: string
                  format: uuid
                  description: Existing host to convert to key auth; omit to create a new one
                name: { type: string, description: Display name; defaults to the hostname }
                hostname: { type: string, minLength: 1 }
                port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
                username: { type: string, minLength: 1 }
                password: { type: string, minLength: 1, description: Used once to install the key; never stored }
                notes: { type: string }
      responses:
        "200":
          description: Host now authenticates by key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHHost" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /ssh-hosts/{id}:
    put:
      operationId: updateSSHHost
      summary: Update an SSH host
      tags: [ssh]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHHostInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHHost" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deleteSSHHost
      summary: Remove an SSH host
      description: Resources bound to it fall back to needing their own credentials.
      tags: [ssh]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ssh-hosts/{id}/test:
    post:
      operationId: testSSHHost
      summary: Verify the stored credentials connect
      tags: [ssh]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      responses:
        "200":
          description: Test outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestConnectionResult" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ssh-hosts/{id}/terminal:
    post:
      operationId: openSSHHostTerminal
      summary: Open an interactive terminal to this host
      description: Requires control on the host. Audited.
      tags: [ssh]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      responses:
        "200":
          description: One-time terminal session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TermSession" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ssh-known-hosts:
    get:
      operationId: listSSHKnownHosts
      summary: Pinned SSH host keys
      description: >
        Every machine HomeHub has pinned a host key for, and what points at it.
        Pins are keyed by address, so one entry covers the SSH registry, a
        Docker daemon over SSH, a Minecraft host and a Proxmox guest console
        alike.
      tags: [ssh]
      responses:
        "200":
          description: Pinned keys
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SSHKnownHost" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /ssh-known-hosts/check:
    post:
      operationId: checkSSHHostKey
      summary: Compare a machine's live host key against its pin
      description: >
        Reads the key the machine is presenting now, without logging in or
        offering a credential, and says whether it still matches.
      tags: [ssh]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHHostKeyRef" }
      responses:
        "200":
          description: What the address is presenting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHHostKeyCheck" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ssh-known-hosts/trust:
    post:
      operationId: trustSSHHostKey
      summary: Pin the key a machine is presenting now
      description: >
        Replaces the pin, restoring every connection to that address at once.
        The fingerprint must match what the machine is presenting at the moment
        of the call, so a stale screen cannot approve a key that has since
        changed again. Requires configure on the SSH registry. Audited.
      tags: [ssh]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SSHHostKeyRef"
                - type: object
                  required: [fingerprint]
                  properties:
                    fingerprint:
                      type: string
                      description: The SHA256 fingerprint being accepted, as shown by a check
      responses:
        "200":
          description: The pin after trusting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHHostKeyCheck" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The machine is presenting a different key than the one being accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ssh-known-hosts/forget:
    post:
      operationId: forgetSSHHostKey
      summary: Drop a pin, returning the address to trust-on-first-use
      description: >
        Weaker than trusting a fingerprint you have looked at, because whatever
        answers next is what gets pinned. Requires configure on the SSH
        registry. Audited.
      tags: [ssh]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSHHostKeyRef" }
      responses:
        "204":
          description: Pin removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /db/instances:
    get:
      operationId: dbListInstances
      summary: All database instances with live stats
      description: Spans every MySQL/MariaDB and MongoDB instance the caller may see; stats are fetched live and null when unreachable.
      tags: [databases]
      responses:
        "200":
          description: Instances of both engines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DbInstance" }

  /db/{id}/databases:
    get:
      operationId: dbListDatabases
      summary: Databases on one instance
      description: Filtered to databases the caller may view (resource mysql|mongodb/<id>/database/<name>).
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Databases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DbDatabase" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
    post:
      operationId: dbCreateDatabase
      summary: Create a database
      description: SQL engines only (MongoDB databases materialize with their first collection). Requires control on the instance. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "204":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/create:
    post:
      operationId: dbCreateObject
      summary: Create a table or collection
      description: The visual builder — SQL takes a typed column list (whitelisted types, PK and auto-increment flags), MongoDB takes just the collection name. Requires control on the database. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                columns:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name: { type: string, minLength: 1, maxLength: 64 }
                      type: { type: string, maxLength: 32 }
                      nullable: { type: boolean, default: false }
                      default: { type: string }
                      primaryKey: { type: boolean, default: false }
                      autoIncrement: { type: boolean, default: false }
      responses:
        "204":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects:
    get:
      operationId: dbListObjects
      summary: Tables or collections in one database
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
      responses:
        "200":
          description: Tables (SQL) or collections (MongoDB)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DbObject" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/peek:
    get:
      operationId: dbPeek
      summary: Newest documents of a MongoDB collection
      description: MongoDB only — SQL engines use the console. Requires control on the database; audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - name: collection
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Documents as extended JSON strings, newest first
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}/schema:
    get:
      operationId: dbObjectSchema
      summary: Structure of a table or collection
      description: SQL columns with types, keys, and indexes, or a MongoDB collection's indexes and sampled keys.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
      responses:
        "200":
          description: The structure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbObjectSchema" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}/data:
    get:
      operationId: dbObjectData
      summary: Rows or documents, paginated
      description: A page of table rows (SQL) or documents (MongoDB) with total count. SQL supports sort plus structured column filters via query params; MongoDB accepts a JSON filter and a sort field.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: orderBy
          in: query
          description: SQL sort column
          schema: { type: string }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: filter
          in: query
          description: SQL structured filters as column:op:value triples (op one of eq,ne,lt,lte,gt,gte,like,is_null,not_null), repeatable; or a single MongoDB extended-JSON filter document
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: sortField
          in: query
          description: MongoDB sort field
          schema: { type: string }
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbDataPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}/rows:
    post:
      operationId: dbInsertRow
      summary: Insert a row or document
      description: Requires control on the database. SQL takes a column→value map (null for SQL NULL); MongoDB takes an extended-JSON document. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DbRowWrite" }
      responses:
        "204":
          description: Inserted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
    patch:
      operationId: dbUpdateRow
      summary: Update a row or document
      description: Requires control on the database. SQL identifies the row by primary key (or, keyless, by the original values sent in `identity`) and sets `values`; MongoDB replaces the document with the matching `_id`. One row/document only. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DbRowWrite" }
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer, format: int64 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}/rows/delete:
    post:
      operationId: dbDeleteRow
      summary: Delete a row or document
      description: Requires control on the database. SQL deletes by identity (primary key or original values); MongoDB deletes by `_id`. One row/document only. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DbRowWrite" }
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer, format: int64 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}:
    delete:
      operationId: dbDropObject
      summary: Drop a table or collection
      description: Destructive. Requires control on the database and a confirm flag. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
        - name: confirm
          in: query
          required: true
          schema: { type: boolean }
      responses:
        "204":
          description: Dropped
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}/truncate:
    post:
      operationId: dbTruncateObject
      summary: Empty a table
      description: SQL only; removes all rows. Destructive. Requires control on the database and a confirm flag. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean }
      responses:
        "204":
          description: Emptied
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/query:
    post:
      operationId: dbQuery
      summary: Run one SQL console statement
      description: SQL engines only. Requires control on the targeted database (or the whole instance when no database is set); results cap at 500 rows. Every statement is audited verbatim.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statement]
              properties:
                database: { type: string }
                statement: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "200":
          description: Result rows or affected count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbQueryResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/sessions:
    get:
      operationId: dbSessions
      summary: Live sessions or operations
      description: The SQL processlist, or MongoDB's active client operations.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Sessions, longest-running first
