      tags: [patchpilot]
      parameters: [{ $ref: "#/components/parameters/idParam" }]
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PatchpilotSchedule" } }
        "404": { $ref: "#/components/responses/NotFound" }
