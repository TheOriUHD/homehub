        serial: { type: string }
        model: { type: string }
        size: { type: integer, format: int64 }
        type: { type: string }
        temperature: { type: integer, nullable: true }
        pool: { type: string }

    TruenasDataset:
      type: object
      required: [name, type, usedBytes, availableBytes]
      properties:
        name: { type: string }
        type: { type: string }
        usedBytes: { type: integer, format: int64 }
        availableBytes: { type: integer, format: int64 }
        compression: { type: string }
        mountpoint: { type: string }

    TruenasShare:
      type: object
      required: [type, name, enabled]
      properties:
        type: { type: string, enum: [smb, nfs, iscsi] }
        name: { type: string }
        path: { type: string }
        enabled: { type: boolean }
        comment: { type: string }

    TruenasSnapshot:
      type: object
      required: [name, dataset]
      properties:
        name: { type: string }
        dataset: { type: string }
        usedBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time, nullable: true }

    TruenasAlert:
      type: object
      required: [level, message, dismissed]
      properties:
        level: { type: string }
        message: { type: string }
        dismissed: { type: boolean }
        createdAt: { type: string, format: date-time, nullable: true }

    HaInstance:
      type: object
      required: [id, name, status, statusMessage, entityCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        entityCount:
          type: integer
          description: Entities visible to the caller, 0 while disconnected
        info:
          allOf:
            - $ref: "#/components/schemas/HaInfo"
          nullable: true

    HaInfo:
      type: object
      required: [version, locationName]
      properties:
        version: { type: string }
        locationName: { type: string }
        timeZone: { type: string }
        country: { type: string }

    HaArea:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    HaEntity:
      type: object
      required: [entityId, domain, objectId, name, state, attributes, lastChanged, lastUpdated]
      properties:
        entityId: { type: string }
        domain: { type: string }
        objectId: { type: string }
        name: { type: string }
        areaId: { type: string }
        category:
          type: string
          description: config or diagnostic for registry-categorized entities, absent for primary entities
        state: { type: string }
        attributes:
          type: object
          additionalProperties: true
        lastChanged: { type: string, format: date-time }
        lastUpdated: { type: string, format: date-time }

    HaDashboard:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/HaDashboardCard" }

    HaDashboardCard:
      type: object
      required: [id, type, entityIds]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
        type:
          type: string
          enum: [entity, group]
        title:
          type: string
          maxLength: 80
          description: Custom display name — replaces the entity's own name on entity cards, heads the card on group cards
        entityIds:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 120 }
        labels:
          type: object
          description: Per-entity display-name overrides for group rows (entity id → custom name)
          additionalProperties: { type: string, maxLength: 80 }
        size:
          type: string
          enum: [small, medium, large]

    HaServiceCall:
      type: object
      required: [service]
      properties:
        service:
          type: string
          pattern: "^[a-z0-9_]+$"
          description: Service name within the entity's domain, e.g. turn_on
        data:
          type: object
          additionalProperties: true
          description: 'Service data, e.g. {"brightness": 200}'

    DnsInstance:
      type: object
      required: [id, name, type, status, statusMessage, capabilities]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [pihole, adguard] }
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        capabilities: { $ref: "#/components/schemas/DnsCapabilities" }
        stats:
          allOf:
            - $ref: "#/components/schemas/DnsStats"
          nullable: true

    DnsQuery:
      type: object
      required: [time, domain, client, type, status]
      properties:
        time: { type: string, format: date-time }
        domain: { type: string }
        client: { type: string }
        clientName: { type: string, nullable: true }
        type: { type: string }
        status: { type: string, enum: [allowed, blocked, cached] }
        reason: { type: string, nullable: true }

    DnsListEntry:
      type: object
      required: [id, type, domain, enabled]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/DnsListType" }
        domain: { type: string }
        enabled: { type: boolean }
        comment: { type: string, nullable: true }

    DnsListInput:
      type: object
      required: [type, domain]
      properties:
        type: { $ref: "#/components/schemas/DnsListType" }
        domain: { type: string, minLength: 1, maxLength: 512 }
        comment: { type: string, maxLength: 256 }

    DnsClient:
      type: object
      required: [id, name, identifiers, groupIds]
      properties:
        id: { type: string }
        name: { type: string }
        identifiers:
          type: array
          items: { type: string }
        groupIds:
          type: array
          items: { type: string }

    DnsGroup:
      type: object
      required: [id, name, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }

    DnsCompareResult:
      type: object
      required: [onlyA, onlyB, commonCount]
      properties:
        onlyA:
          type: array
          items: { $ref: "#/components/schemas/DnsListEntry" }
        onlyB:
          type: array
          items: { $ref: "#/components/schemas/DnsListEntry" }
        commonCount: { type: integer }

    DnsSyncResult:
      type: object
      required: [added, failed]
      properties:
        added: { type: integer }
        failed:
          type: array
          items:
            type: object
            required: [domain, error]
            properties:
              domain: { type: string }
              error: { type: string }

    MetricQueryResult:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items:
            type: object
            required: [ts, avg, min, max]
            properties:
              ts: { type: string, format: date-time }
              avg: { type: number }
              min: { type: number }
              max: { type: number }
