        keyExpiryDisabled: { type: boolean }
        online: { type: boolean }
        external: { type: boolean }
        created: { type: string }
        expires: { type: string }
        lastSeen: { type: string }
        tags:
          type: array
          items: { type: string }
        advertisedRoutes:
