          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /proxmox/{id}/backup-jobs/{jobId}:
    put:
      operationId: pveUpdateBackupJob
      summary: Update a scheduled vzdump job
      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
