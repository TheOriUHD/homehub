      required: [seq, ts, text]
      properties:
        seq: { type: integer, format: int64 }
        ts:
          type: integer
          format: int64
          description: Server-side unix milliseconds
        level: { type: string }
        text: { type: string }

    McDownload:
      type: object
      required: [loader, file, sizeBytes, mcVersions]
      properties:
        loader: { type: string }
        file: { type: string }
        sizeBytes: { type: integer, format: int64 }
        minecraft:
          type: string
          description: >-
            The game version this jar was built against, e.g. "26.2". Set for
            loaders that need one jar per version family (Fabric, Forge);
            absent when one jar covers every version the loader runs.
        mcVersions:
          type: string
          description: Human-readable supported range, e.g. "1.21.5 – 1.21.8"

    ApertureCamera:
      type: object
      required: [id, name, enabled, recordMode, sortOrder, recordingExpected, recordingOk, liveOk, coveragePercent, watchdogStale, restartsToday]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        recordMode: { type: string }
        sortOrder: { type: integer }
        recordingExpected:
          type: boolean
          description: Whether this camera is supposed to record at all — live-only cameras are healthy without footage.
        recordingOk: { type: boolean }
        liveOk: { type: boolean }
        coveragePercent: { type: integer }
        watchdogStale: { type: boolean }
        restartsToday: { type: integer }
        lastSegmentTs:
          type: integer
          format: int64
          description: Epoch milliseconds.
        storageBytes: { type: integer, format: int64 }
        oldestTs:
          type: integer
          format: int64
          description: Epoch milliseconds — start of this camera's retained history.
        newestTs: { type: integer, format: int64 }

    ApertureOverview:
      type: object
      required: [baseUrl, cameras, bitrate]
      properties:
        baseUrl:
          type: string
          description: The Aperture origin, for the link out.
        cameras:
          type: array
          items: { $ref: "#/components/schemas/ApertureCamera" }
        capBytes: { type: integer, format: int64 }
        bitrate:
          type: array
          items:
            type: object
            required: [ts, bps]
            properties:
              ts: { type: integer, format: int64 }
              bps: { type: integer, format: int64 }

    ApertureStreamGrant:
      type: object
      required: [wsUrl, hasSub]
      properties:
        wsUrl:
          type: string
          description: Absolute wss:// URL with the short-lived token embedded.
        hasSub: { type: boolean }

    CaddyHeaderUp:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }

    CaddySiteInput:
      type: object
      required: [domain, upstreamHost]
      properties:
        domain: { type: string, minLength: 1 }
        extraDomains:
          type: array
          items: { type: string }
        upstreamScheme: { type: string }
        upstreamHost: { type: string, minLength: 1 }
        upstreamPort: { type: string }
        dnsProvider: { type: string }
        dnsArgs:
          type: string
          description: Kept verbatim — usually an {env.*} placeholder; never re-quoted or expanded.
        encode: { type: string }
        headerUp:
          type: array
          items: { $ref: "#/components/schemas/CaddyHeaderUp" }
        insecureUpstream: { type: boolean }

    CaddySite:
      allOf:
        - $ref: "#/components/schemas/CaddySiteInput"
        - type: object
          required: [unknownDirectives]
          properties:
            unknownDirectives:
              type: array
              items: { type: string }
              description: Directives the model does not know, preserved verbatim and carried across edits.

    CaddyRawSite:
      type: object
      required: [addresses, reason, raw]
      properties:
        addresses:
          type: array
          items: { type: string }
        reason: { type: string }
        raw: { type: string }

    CaddySitesState:
      type: object
      required: [path, writable, entries, rawSites]
      properties:
        path: { type: string }
        writable: { type: boolean }
        refusal: { type: string }
        global: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/CaddySite" }
        rawSites:
          type: array
          items: { $ref: "#/components/schemas/CaddyRawSite" }
        siteDefaults:
          allOf: [{ $ref: "#/components/schemas/CaddySiteDefaults" }]
          nullable: true
          description: The "site template" inferred from existing entries — what new sites default to

    CaddySiteDefaults:
      type: object
      properties:
        dnsProvider: { type: string }
        dnsArgs: { type: string }
        encode: { type: string }

    CaddyServed:
      type: object
      required: [upstreams, unresolvable, domainsWithoutProxy, warnings]
      properties:
        upstreams:
          type: array
          items:
            type: object
            required: [domain, host, dial]
            properties:
              domain: { type: string }
              host: { type: string }
              port: { type: string }
              dial: { type: string }
        unresolvable:
          type: array
          items:
            type: object
            required: [domain, reason]
            properties:
              domain: { type: string }
              reason: { type: string }
        domainsWithoutProxy:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    CaddyCfLinkResult:
      type: object
      required: [linked]
      properties:
        linked: { type: boolean }
        zoneName: { type: string }
        recordContent: { type: string }
        proxied: { type: boolean }
        zones:
          type: array
          description: Present when the token manages several zones and none was chosen yet
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }

    CaddyDnsRecord:
      type: object
      required: [id, type, name, content, proxied, ttl]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string, description: FQDN as Cloudflare stores it }
        content: { type: string }
        proxied: { type: boolean }
        ttl: { type: integer, description: "1 = auto" }
        routeDomain: { type: string, description: "the Caddy site serving this name, when one exists" }
        routeUpstream: { type: string, description: "that site's upstream (host:port)" }

    CaddyDnsRecordInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: "\"@\", a bare subdomain, or a full name" }
        type: { type: string, description: "A / AAAA / CNAME / TXT / …; auto-detected from content when omitted" }
        content: { type: string, description: defaults to the link's configured target }
        proxied: { type: boolean }
        ttl: { type: integer }

    CaddyDnsState:
      type: object
      required: [zoneName, recordContent, proxiedDefault, records, missingDns]
      properties:
        zoneName: { type: string }
        recordContent: { type: string, description: the link's default record target }
        proxiedDefault: { type: boolean }
        records:
          type: array
          items: { $ref: "#/components/schemas/CaddyDnsRecord" }
        missingDns:
          type: array
          description: Caddy domains under this zone that have no DNS record
          items: { type: string }
        siteDefaults:
          allOf: [{ $ref: "#/components/schemas/CaddySiteDefaults" }]
          nullable: true

    CaddyPublishResult:
      type: object
      required: [domain, dnsStatus, dnsMessage, siteStatus, siteMessage]
      properties:
        domain: { type: string, description: the FQDN that was published }
        dnsStatus:
          type: string
          enum: [created, exists, skipped, error, unlinked]
        dnsMessage: { type: string }
        siteStatus:
          type: string
          enum: [created, error]
        siteMessage: { type: string }
        sites:
          allOf: [{ $ref: "#/components/schemas/CaddySitesState" }]
          nullable: true

    TsTailnet:
      type: object
      required: [id, name, status, statusMessage, deviceCount, onlineCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        deviceCount: { type: integer }
        onlineCount: { type: integer }

    TsDevice:
      type: object
      required: [id, name, hostname, user, addresses, os, clientVersion, updateAvailable, authorized, keyExpiryDisabled, online, external, tags, advertisedRoutes, enabledRoutes]
      properties:
        id: { type: string }
        name: { type: string }
        hostname: { type: string }
        user: { type: string }
        addresses:
          type: array
          items: { type: string }
        os: { type: string }
        clientVersion: { type: string }
        updateAvailable: { type: boolean }
        authorized: { type: boolean }
        keyExpiryDisabled: { type: boolean }
        online: { type: boolean }
        external: { type: boolean }
        created: { type: string }
        expires: { type: string }
        lastSeen: { type: string }
        tags:
          type: array
          items: { type: string }
        advertisedRoutes:
          type: array
          items: { type: string }
        enabledRoutes:
          type: array
          items: { type: string }

    TsKey:
      type: object
      required: [id, description, invalid, reusable, ephemeral, preauthorized, tags]
      properties:
        id: { type: string }
        description: { type: string }
        created: { type: string }
        expires: { type: string }
        revoked: { type: string }
        invalid: { type: boolean }
        reusable: { type: boolean }
        ephemeral: { type: boolean }
        preauthorized: { type: boolean }
        tags:
          type: array
          items: { type: string }

    TsCreatedKey:
      allOf:
        - $ref: "#/components/schemas/TsKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The key secret — shown exactly once.

    TsDns:
      type: object
      required: [nameservers, magicDns, searchPaths]
      properties:
        nameservers:
          type: array
          items: { type: string }
        magicDns: { type: boolean }
        searchPaths:
          type: array
          items: { type: string }

    AmpPanel:
      type: object
      required: [id, name, status, statusMessage, instanceCount, runningCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        instanceCount: { type: integer }
        runningCount: { type: integer }

    AmpOverview:
      type: object
      required: [targets]
      properties:
        targets:
          type: array
          items: { $ref: "#/components/schemas/AmpTarget" }

    AmpTarget:
      type: object
      required: [instanceId, friendlyName, state, online, instances]
      properties:
        instanceId: { type: string }
        friendlyName: { type: string }
        description: { type: string }
        state: { type: string }
        online: { type: boolean }
        platform: { type: string }
        cpuModel: { type: string }
        cores: { type: integer }
        ramMb: { type: integer }
        instances:
          type: array
          items: { $ref: "#/components/schemas/AmpServerInstance" }

    AmpServerInstance:
      type: object
      required: [id, name, friendlyName, module, moduleName, running, suspended, state]
      properties:
        id: { type: string }
        name: { type: string }
        friendlyName: { type: string }
        description: { type: string }
        module: { type: string }
        moduleName: { type: string }
        running: { type: boolean }
        suspended: { type: boolean }
        state: { type: string }
        ip: { type: string }
        port: { type: integer }
        diskUsageMb: { type: integer, format: int64 }
        cpuPercent: { type: number, format: double }
        memUsedMb: { type: number, format: double }
        memMaxMb: { type: number, format: double }
        players: { type: integer }
        maxPlayers: { type: integer }

    AmpInstanceStatus:
      type: object
      required: [state, uptime]
      properties:
        state: { type: string }
        uptime: { type: string }
        cpuPercent: { type: number, format: double }
        memUsedMb: { type: number, format: double }
        memMaxMb: { type: number, format: double }
        players: { type: integer }
        maxPlayers: { type: integer }

    AmpConsole:
      type: object
      required: [lines, oldestSeq, nextSeq]
      properties:
        lines:
          type: array
          items: { $ref: "#/components/schemas/AmpConsoleLine" }
        oldestSeq: { type: integer, format: int64 }
        nextSeq: { type: integer, format: int64 }

    AmpConsoleLine:
      type: object
      required: [seq, ts, type, contents]
      properties:
        seq: { type: integer, format: int64 }
        ts: { type: integer, format: int64 }
        type: { type: string }
        source: { type: string }
        contents: { type: string }

    TruenasInstance:
      type: object
      required: [id, name, status, statusMessage]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        info:
          allOf:
            - $ref: "#/components/schemas/TruenasSystemInfo"
          nullable: true
        poolCount: { type: integer }

    TruenasSystemInfo:
      type: object
      required: [version, hostname]
      properties:
        version: { type: string }
        hostname: { type: string }
        uptime: { type: string }
        uptimeSeconds: { type: integer, format: int64 }
        model: { type: string }
        cores: { type: integer }
        physicalMemoryBytes: { type: integer, format: int64 }

    TruenasOverview:
      type: object
      required: [pools, disks]
      properties:
        info:
          allOf:
            - $ref: "#/components/schemas/TruenasSystemInfo"
          nullable: true
        memory:
          allOf:
            - $ref: "#/components/schemas/TruenasMemory"
          nullable: true
          description: RAM allocation for the dashboard dial; null when reporting data is unavailable
        pools:
          type: array
          items: { $ref: "#/components/schemas/TruenasPool" }
        disks:
          type: array
          items: { $ref: "#/components/schemas/TruenasDisk" }

    TruenasMemory:
      type: object
      required: [totalBytes, arcBytes, servicesBytes, freeBytes]
      properties:
        totalBytes: { type: integer, format: int64 }
        arcBytes:
          type: integer
          format: int64
          description: ZFS cache (ARC)
        servicesBytes:
          type: integer
          format: int64
          description: Everything else in use
        freeBytes: { type: integer, format: int64 }

    TruenasPool:
      type: object
      required: [name, status, healthy, sizeBytes, allocatedBytes, freeBytes, usedPct]
      properties:
        name: { type: string }
        status: { type: string }
        healthy: { type: boolean }
        sizeBytes: { type: integer, format: int64 }
        allocatedBytes: { type: integer, format: int64 }
        freeBytes: { type: integer, format: int64 }
        usedPct: { type: number, format: double }
        fragmentation: { type: string }

    TruenasDisk:
      type: object
      required: [name, size, type]
      properties:
        name: { type: string }
        serial: { type: string }
        model: { type: string }
        size: { type: integer, format: int64 }
        type: { type: string }
        temperature: { type: integer, nullable: true }
        pool: { type: string }

    TruenasDataset:
      type: object
      required: [name, type, usedBytes, availableBytes]
      properties:
        name: { type: string }
        type: { type: string }
        usedBytes: { type: integer, format: int64 }
        availableBytes: { type: integer, format: int64 }
        compression: { type: string }
        mountpoint: { type: string }

    TruenasShare:
      type: object
      required: [type, name, enabled]
      properties:
        type: { type: string, enum: [smb, nfs, iscsi] }
        name: { type: string }
        path: { type: string }
        enabled: { type: boolean }
        comment: { type: string }

    TruenasSnapshot:
      type: object
      required: [name, dataset]
      properties:
        name: { type: string }
        dataset: { type: string }
        usedBytes: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time, nullable: true }

    TruenasAlert:
      type: object
      required: [level, message, dismissed]
      properties:
        uuid: { type: string }
        level: { type: string }
        message: { type: string }
        dismissed: { type: boolean }
        createdAt: { type: string, format: date-time, nullable: true }

    TruenasStatPoint:
      type: object
      required: [ts, value]
      properties:
        ts: { type: integer, format: int64, description: "Unix seconds" }
        value: { type: number, format: double }

    TruenasLoadPoint:
      type: object
      required: [ts, load1, load5, load15]
      properties:
        ts: { type: integer, format: int64 }
        load1: { type: number, format: double }
        load5: { type: number, format: double }
        load15: { type: number, format: double }

    TruenasTrafficPoint:
      type: object
      required: [ts, inBps, outBps]
      properties:
        ts: { type: integer, format: int64 }
        inBps: { type: number, format: double }
        outBps: { type: number, format: double }

    TruenasInterfaceTraffic:
      type: object
      required: [name, type, linkState, up, points]
      properties:
        name: { type: string }
        type: { type: string, description: "PHYSICAL | BRIDGE | VLAN | …" }
        linkState: { type: string }
        up: { type: boolean }
        media: { type: string }
        addresses:
          type: array
          items: { type: string }
        points:
          type: array
          items: { $ref: "#/components/schemas/TruenasTrafficPoint" }

    TruenasStats:
      type: object
      required: [cpu, load, memoryAvailable, arcSize, totalMemoryBytes, interfaces]
      properties:
        cpu:
          type: array
          items: { $ref: "#/components/schemas/TruenasStatPoint" }
        load:
          type: array
          items: { $ref: "#/components/schemas/TruenasLoadPoint" }
        memoryAvailable:
          type: array
          items: { $ref: "#/components/schemas/TruenasStatPoint" }
        arcSize:
          type: array
          items: { $ref: "#/components/schemas/TruenasStatPoint" }
        totalMemoryBytes: { type: integer, format: int64 }
        interfaces:
          type: array
          items: { $ref: "#/components/schemas/TruenasInterfaceTraffic" }

    MoonrakerSnapshot:
      type: object
      required: [klippy, printer, heaters, sensors, tempFans, fans, leds, outputPins, macros, cameras, extra, updatedAt, live]
      properties:
        klippy: { $ref: "#/components/schemas/MoonrakerKlippy" }
        printer: { $ref: "#/components/schemas/MoonrakerPrinterMeta" }
        print:
          allOf: [{ $ref: "#/components/schemas/MoonrakerPrintJob" }]
          nullable: true
        toolhead:
          allOf: [{ $ref: "#/components/schemas/MoonrakerToolhead" }]
          nullable: true
        heaters:
          type: array
          items: { $ref: "#/components/schemas/MoonrakerHeater" }
        sensors:
          type: array
          items: { $ref: "#/components/schemas/MoonrakerSensor" }
        tempFans:
          type: array
          items: { $ref: "#/components/schemas/MoonrakerTempFan" }
        fans:
          type: array
          items: { $ref: "#/components/schemas/MoonrakerFan" }
        leds:
          type: array
          items: { $ref: "#/components/schemas/MoonrakerLed" }
        outputPins:
          type: array
          items: { $ref: "#/components/schemas/MoonrakerOutputPin" }
        macros:
          type: array
          items: { $ref: "#/components/schemas/MoonrakerMacro" }
        cameras:
          type: array
          items: { $ref: "#/components/schemas/MoonrakerCamera" }
        extra:
          type: array
          description: Object names the printer exposes that have no dedicated control yet
          items: { type: string }
        updatedAt: { type: string, format: date-time }
        live:
          type: boolean
          description: True when a live WebSocket subscription is feeding this state

    MoonrakerKlippy:
      type: object
      required: [state, message]
      properties:
        state:
          type: string
          description: ready | startup | shutdown | error | disconnected
        message: { type: string }

    MoonrakerPrinterMeta:
      type: object
      required: [hostname, klipperVersion, moonrakerVersion, cpuInfo]
      properties:
        hostname: { type: string }
        klipperVersion: { type: string }
        moonrakerVersion: { type: string }
        cpuInfo: { type: string }

    MoonrakerPrintJob:
      type: object
      required: [state, filename, progress, message, printDuration, totalDuration, filamentUsed, currentLayer, totalLayer]
      properties:
        state:
          type: string
          description: standby | printing | paused | complete | cancelled | error
        filename: { type: string }
        progress: { type: number, description: "0..1" }
        message: { type: string }
        printDuration: { type: number, description: "seconds actually printing" }
        totalDuration: { type: number, description: "seconds wall-clock" }
        filamentUsed: { type: number, description: "mm" }
        currentLayer: { type: integer }
        totalLayer: { type: integer }

    MoonrakerToolhead:
      type: object
      required: [position, homedAxes, speedFactor, extrudeFactor, maxVelocity, speed]
      properties:
        position:
          type: array
          items: { type: number }
          description: "[x, y, z, e]"
        homedAxes: { type: string, description: "homed axes, e.g. \"xyz\"" }
        speedFactor: { type: number, description: "1.0 = 100%" }
        extrudeFactor: { type: number, description: "1.0 = 100%" }
        fanSpeed: { type: number, description: "part-cooling fan 0..1, if present" }
        maxVelocity: { type: number }
        speed: { type: number, description: "current requested speed mm/s" }

    MoonrakerHeater:
      type: object
      required: [object, name, kind, temp, target, power]
      properties:
        object: { type: string, description: "full Klipper object name (control target)" }
        name: { type: string }
        kind: { type: string, description: "extruder | bed | generic" }
        temp: { type: number }
        target: { type: number }
        power: { type: number, description: "0..1 duty" }

    MoonrakerSensor:
      type: object
      required: [object, name, temp]
      properties:
        object: { type: string }
        name: { type: string }
        temp: { type: number }
        minTemp: { type: number }
        maxTemp: { type: number }

    MoonrakerTempFan:
      type: object
      required: [object, name, temp, target, speed]
      properties:
        object: { type: string }
        name: { type: string }
        temp: { type: number }
        target: { type: number }
        speed: { type: number, description: "0..1" }

    MoonrakerFan:
      type: object
      required: [object, name, kind, speed, controllable]
      properties:
        object: { type: string }
        name: { type: string }
        kind: { type: string, description: "part | generic | heater | controller" }
        speed: { type: number, description: "0..1" }
        rpm: { type: number }
        controllable: { type: boolean }

    MoonrakerLed:
      type: object
      required: [object, name, kind, color, pixels]
      properties:
        object: { type: string }
        name: { type: string }
        kind: { type: string }
        color:
          type: array
          items: { type: number }
          description: "[r, g, b, w] 0..1 (first pixel)"
        pixels: { type: integer }

    MoonrakerOutputPin:
      type: object
      required: [object, name, value, pwm]
      properties:
        object: { type: string }
        name: { type: string }
        value: { type: number }
        pwm: { type: boolean }

    MoonrakerMacro:
      type: object
      required: [object, name]
      properties:
        object: { type: string }
        name: { type: string }
        description: { type: string }

    MoonrakerCamera:
      type: object
      required: [name, service, flipHorizontal, flipVertical, rotation, targetFps, aspectRatio, snapshot]
      properties:
        name: { type: string }
        service: { type: string, description: "the streamer, e.g. mjpegstreamer-adaptive, uv4l-mjpeg, webrtc" }
        flipHorizontal: { type: boolean }
        flipVertical: { type: boolean }
        rotation: { type: integer, description: "0 | 90 | 180 | 270" }
        targetFps: { type: integer }
        aspectRatio: { type: string, description: "e.g. 4:3, 16:9" }
        snapshot: { type: boolean, description: "a still-image URL is available for this camera" }

    PatchpilotHost:
      type: object
      required: [id, name, hostname, sshPort, sshUser, hostType, packageManager, isProxmox, critical, enabled, autoReboot, updatesPending, rebootRequired]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hostname: { type: string }
        sshPort: { type: integer }
        sshUser: { type: string }
        hostType: { type: string }
        packageManager: { type: string }
        osPretty: { type: string }
        arch: { type: string }
        isProxmox: { type: boolean }
        critical:
          type: boolean
          description: Marked critical / the hypervisor — immediate runs including it get an escalated confirm.
        enabled: { type: boolean }
        autoReboot: { type: boolean }
        notes: { type: string }
        updatesPending: { type: integer }
        rebootRequired: { type: boolean }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        lastRunStatus: { type: string }
        lastRunAt: { type: string, format: date-time, nullable: true }
        sshHostId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The SSH registry entry this host is bound to. Its address is used for
            every connection and its credential for bootstrap re-runs; null for a
            host that was entered by hand.
        sshHostName:
          type: string
          description: Display name of the bound registry entry, when bound.
    PatchpilotHostCredential:
      type: object
      description: >-
        How to log in for detection and bootstrap. Either `sshHostId` (the
        registry entry's address and stored key or password are used) or
        `hostname` + `sshUser` + `password` by hand. With a registry key,
        `password` is the sudo password, asked for only when detection reports
        `needsPassword`.
      properties:
        sshHostId: { type: string, format: uuid }
        hostname: { type: string }
        sshPort: { type: integer }
        sshUser: { type: string }
        password: { type: string }
        rootPassword: { type: string }
    PatchpilotOnboardInput:
      type: object
      description: >-
        PatchpilotHostCredential plus the host's fleet settings. `name` defaults
        to the registry entry's name when bound.
      properties:
        name: { type: string }
        sshHostId: { type: string, format: uuid }
        hostname: { type: string }
        sshPort: { type: integer }
        sshUser: { type: string }
        password: { type: string }
        rootPassword: { type: string }
        notes: { type: string }
        autoReboot: { type: boolean }
    PatchpilotHostBinding:
      type: object
      required: [sshHostId]
      properties:
        sshHostId:
          type: string
          format: uuid
          nullable: true
          description: Registry entry to bind to; null unbinds and keeps the current address as a manual host.
    PatchpilotRebootstrapInput:
      type: object
      description: >-
        Credentials for a bootstrap re-run. A bound host needs nothing (the
        registry credential is used; `password` is then the sudo password if
        detection asks for one); a manual host needs `sshUser` + `password`.
      properties:
        sshUser: { type: string }
        password: { type: string }
        rootPassword: { type: string }
    PatchpilotDetectResult:
      type: object
      required: [reachable, message]
      properties:
        reachable: { type: boolean }
        osPretty: { type: string }
        arch: { type: string }
        hostname: { type: string }
        packageManager: { type: string }
        isProxmox: { type: boolean }
        escalation: { type: string }
        needsPassword: { type: boolean }
        refusal: { type: string }
        blocker: { type: string }
        message: { type: string }
    PatchpilotDryRunResult:
      type: object
      required: [packagesUpgraded, packagesRemoved, rebootRequired, summary, rawOutput]
      properties:
        packagesUpgraded: { type: integer }
        packagesRemoved: { type: integer }
        rebootRequired: { type: boolean }
        summary: { type: string }
        rawOutput: { type: string }
    PatchpilotSchedule:
      type: object
      required: [id, name, cronExpr, enabled, suppressReboot, hostIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cronExpr: { type: string }
        enabled: { type: boolean }
        suppressReboot: { type: boolean }
        hostIds: { type: array, items: { type: string, format: uuid } }
        lastRunAt: { type: string, format: date-time, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }
        lastSkippedAt: { type: string, format: date-time, nullable: true }
        lastSkipReason: { type: string }
    PatchpilotScheduleInput:
      type: object
      required: [name, cronExpr, hostIds]
      properties:
        name: { type: string }
        cronExpr: { type: string }
        enabled: { type: boolean }
        suppressReboot: { type: boolean }
        hostIds: { type: array, items: { type: string, format: uuid } }
    PatchpilotRun:
      type: object
      required: [id, trigger, status, startedAt, summary]
      properties:
        id: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid, nullable: true }
        trigger: { type: string }
        status: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        summary: { type: string }
    PatchpilotHostRun:
      type: object
      required: [id, runId, hostName, status, packagesUpgraded, rebootRequired]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        hostId: { type: string, format: uuid }
        hostName: { type: string }
        status: { type: string }
        exitCode: { type: integer, nullable: true }
        packagesUpgraded: { type: integer }
        rebootRequired: { type: boolean }
        errorSummary: { type: string }
        log: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    PatchpilotRunDetail:
      type: object
      required: [run, hostRuns]
      properties:
        run: { $ref: "#/components/schemas/PatchpilotRun" }
        hostRuns: { type: array, items: { $ref: "#/components/schemas/PatchpilotHostRun" } }

    HaInstance:
      type: object
      required: [id, name, status, statusMessage, entityCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        entityCount:
          type: integer
          description: Entities visible to the caller, 0 while disconnected
        info:
          allOf:
            - $ref: "#/components/schemas/HaInfo"
          nullable: true

    HaInfo:
      type: object
      required: [version, locationName]
      properties:
        version: { type: string }
        locationName: { type: string }
        timeZone: { type: string }
        country: { type: string }

    HaArea:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    HaEntity:
      type: object
      required: [entityId, domain, objectId, name, state, attributes, lastChanged, lastUpdated]
      properties:
        entityId: { type: string }
        domain: { type: string }
        objectId: { type: string }
        name: { type: string }
        areaId: { type: string }
        category:
          type: string
          description: config or diagnostic for registry-categorized entities, absent for primary entities
        state: { type: string }
        attributes:
          type: object
          additionalProperties: true
        lastChanged: { type: string, format: date-time }
        lastUpdated: { type: string, format: date-time }

    HaDashboard:
      type: object
      required: [cards]
      properties:
        cards:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/HaDashboardCard" }

    HaDashboardCard:
      type: object
      required: [id, type, entityIds]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 40
        type:
          type: string
          enum: [entity, group]
        title:
          type: string
          maxLength: 80
          description: Custom display name — replaces the entity's own name on entity cards, heads the card on group cards
        entityIds:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 120 }
        labels:
          type: object
          description: Per-entity display-name overrides for group rows (entity id → custom name)
          additionalProperties: { type: string, maxLength: 80 }
        size:
          type: string
          enum: [small, medium, large]

    HaServiceCall:
      type: object
      required: [service]
      properties:
        service:
          type: string
          pattern: "^[a-z0-9_]+$"
          description: Service name within the entity's domain, e.g. turn_on
        data:
          type: object
          additionalProperties: true
          description: 'Service data, e.g. {"brightness": 200}'

    DnsInstance:
      type: object
      required: [id, name, type, status, statusMessage, capabilities]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [pihole, adguard] }
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        capabilities: { $ref: "#/components/schemas/DnsCapabilities" }
        stats:
          allOf:
            - $ref: "#/components/schemas/DnsStats"
          nullable: true

    DnsQuery:
      type: object
      required: [time, domain, client, type, status]
      properties:
        time: { type: string, format: date-time }
        domain: { type: string }
        client: { type: string }
        clientName: { type: string, nullable: true }
        type: { type: string }
        status: { type: string, enum: [allowed, blocked, cached] }
        reason: { type: string, nullable: true }

    DnsListEntry:
      type: object
      required: [id, type, domain, enabled]
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/DnsListType" }
        domain: { type: string }
        enabled: { type: boolean }
        comment: { type: string, nullable: true }

    DnsListInput:
      type: object
      required: [type, domain]
      properties:
        type: { $ref: "#/components/schemas/DnsListType" }
        domain: { type: string, minLength: 1, maxLength: 512 }
        comment: { type: string, maxLength: 256 }

    DnsClient:
      type: object
      required: [id, name, identifiers, groupIds]
      properties:
        id: { type: string }
        name: { type: string }
        identifiers:
          type: array
          items: { type: string }
        groupIds:
          type: array
          items: { type: string }

    DnsGroup:
      type: object
      required: [id, name, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }

    DnsCompareResult:
      type: object
      required: [onlyA, onlyB, commonCount]
      properties:
        onlyA:
          type: array
          items: { $ref: "#/components/schemas/DnsListEntry" }
        onlyB:
          type: array
          items: { $ref: "#/components/schemas/DnsListEntry" }
        commonCount: { type: integer }

    DnsSyncResult:
      type: object
      required: [added, failed]
      properties:
        added: { type: integer }
        failed:
          type: array
          items:
            type: object
            required: [domain, error]
            properties:
              domain: { type: string }
              error: { type: string }

    MetricQueryResult:
      type: object
      required: [points]
      properties:
        points:
          type: array
          items:
            type: object
            required: [ts, avg, min, max]
            properties:
              ts: { type: string, format: date-time }
              avg: { type: number }
              min: { type: number }
              max: { type: number }
