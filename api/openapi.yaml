  /caddy/{id}/cloudflare/link:
    post:
      operationId: caddyCfLink
      summary: Link (or re-configure) a Cloudflare zone for this Caddy instance
      description: >-
        Verifies the API token (Zone → DNS → Edit scope) and stores the link.
        Without a zoneId the call returns the zones the token can manage so the
        caller can pick one — nothing is stored until a zone is chosen (a token
        with exactly one zone links immediately). Omitting the token keeps the
        stored one, so zone/target/proxied can be re-configured without
        re-pasting it. The token lives in the vault and never reaches the
        browser. Requires configure on the instance.
      tags: [caddy]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, description: "Cloudflare API token; empty keeps the stored token" }
                zoneId: { type: string }
                recordContent: { type: string, description: "default target for new records — the reverse proxy's IP or hostname" }
                proxied: { type: boolean, description: "default proxied (orange-cloud) mode for new records" }
      responses:
        "200":
          description: Linked, or the zone choices when none was given
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaddyCfLinkResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: caddyCfUnlink
      summary: Remove the Cloudflare link (token and zone settings)
      tags: [caddy]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204":
          description: Unlinked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /caddy/{id}/dns:
    get:
      operationId: caddyDns
      summary: The linked zone's DNS records, matched against Caddy sites
      description: >-
        Every record in the linked Cloudflare zone, each annotated with the
        Caddy site that serves its name (when one exists), plus the list of
        Caddy domains under the zone that have no DNS record yet.
      tags: [caddy]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: DNS state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaddyDnsState" }
