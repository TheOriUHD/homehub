          $ref: "#/components/responses/NotFound"
    put:
      operationId: putSSHCredential
      summary: Store SSH access for a resource
      tags: [resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, username, authType]
              properties:
                resource: { type: string }
                host:
                  type: string
                  description: Hostname or IP; required until guest-agent address discovery lands
                port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
                username: { type: string, minLength: 1 }
                authType: { type: string, enum: [password, key] }
                secret:
                  type: string
                  description: Password or PEM private key; omit to keep the stored secret
      responses:
        "200":
          description: Stored credential metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSHCredentialInfo" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteSSHCredential
      summary: Remove SSH access for a resource
      tags: [resources]
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Removed
        "403":
          $ref: "#/components/responses/Forbidden"

  /db/instances:
    get:
      operationId: dbListInstances
      summary: All database instances with live stats
      description: Spans every MySQL/MariaDB and MongoDB instance the caller may see; stats are fetched live and null when unreachable.
      tags: [databases]
      responses:
        "200":
          description: Instances of both engines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DbInstance" }

  /db/{id}/databases:
    get:
      operationId: dbListDatabases
      summary: Databases on one instance
      description: Filtered to databases the caller may view (resource mysql|mongodb/<id>/database/<name>).
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Databases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DbDatabase" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
    post:
      operationId: dbCreateDatabase
      summary: Create a database
      description: SQL engines only (MongoDB databases materialize with their first collection). Requires control on the instance. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "204":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/create:
    post:
      operationId: dbCreateObject
      summary: Create a table or collection
      description: The visual builder — SQL takes a typed column list (whitelisted types, PK and auto-increment flags), MongoDB takes just the collection name. Requires control on the database. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                columns:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name: { type: string, minLength: 1, maxLength: 64 }
                      type: { type: string, maxLength: 32 }
                      nullable: { type: boolean, default: false }
                      default: { type: string }
                      primaryKey: { type: boolean, default: false }
                      autoIncrement: { type: boolean, default: false }
      responses:
        "204":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects:
    get:
      operationId: dbListObjects
      summary: Tables or collections in one database
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
      responses:
        "200":
          description: Tables (SQL) or collections (MongoDB)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DbObject" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/peek:
    get:
      operationId: dbPeek
      summary: Newest documents of a MongoDB collection
      description: MongoDB only — SQL engines use the console. Requires control on the database; audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - name: collection
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Documents as extended JSON strings, newest first
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}/schema:
    get:
      operationId: dbObjectSchema
      summary: Structure of a table or collection
      description: SQL columns with types, keys, and indexes, or a MongoDB collection's indexes and sampled keys.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
      responses:
        "200":
          description: The structure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbObjectSchema" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}/data:
    get:
      operationId: dbObjectData
      summary: Rows or documents, paginated
      description: A page of table rows (SQL) or documents (MongoDB) with total count. SQL supports sort plus structured column filters via query params; MongoDB accepts a JSON filter and a sort field.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: orderBy
          in: query
          description: SQL sort column
          schema: { type: string }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc] }
        - name: filter
          in: query
          description: SQL structured filters as column:op:value triples (op one of eq,ne,lt,lte,gt,gte,like,is_null,not_null), repeatable; or a single MongoDB extended-JSON filter document
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: sortField
          in: query
          description: MongoDB sort field
          schema: { type: string }
      responses:
        "200":
          description: A page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbDataPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}/rows:
    post:
      operationId: dbInsertRow
      summary: Insert a row or document
      description: Requires control on the database. SQL takes a column→value map (null for SQL NULL); MongoDB takes an extended-JSON document. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DbRowWrite" }
      responses:
        "204":
          description: Inserted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
    patch:
      operationId: dbUpdateRow
      summary: Update a row or document
      description: Requires control on the database. SQL identifies the row by primary key (or, keyless, by the original values sent in `identity`) and sets `values`; MongoDB replaces the document with the matching `_id`. One row/document only. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DbRowWrite" }
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer, format: int64 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}/rows/delete:
    post:
      operationId: dbDeleteRow
      summary: Delete a row or document
      description: Requires control on the database. SQL deletes by identity (primary key or original values); MongoDB deletes by `_id`. One row/document only. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DbRowWrite" }
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                type: object
                required: [affected]
                properties:
                  affected: { type: integer, format: int64 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}:
    delete:
      operationId: dbDropObject
      summary: Drop a table or collection
      description: Destructive. Requires control on the database and a confirm flag. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
        - name: confirm
          in: query
          required: true
          schema: { type: boolean }
      responses:
        "204":
          description: Dropped
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/databases/{database}/objects/{object}/truncate:
    post:
      operationId: dbTruncateObject
      summary: Empty a table
      description: SQL only; removes all rows. Destructive. Requires control on the database and a confirm flag. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/dbNameParam"
        - $ref: "#/components/parameters/dbObjectParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean }
      responses:
        "204":
          description: Emptied
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/query:
    post:
      operationId: dbQuery
      summary: Run one SQL console statement
      description: SQL engines only. Requires control on the targeted database (or the whole instance when no database is set); results cap at 500 rows. Every statement is audited verbatim.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statement]
              properties:
                database: { type: string }
                statement: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "200":
          description: Result rows or affected count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DbQueryResult" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/sessions:
    get:
      operationId: dbSessions
      summary: Live sessions or operations
      description: The SQL processlist, or MongoDB's active client operations.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200":
          description: Sessions, longest-running first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DbSession" }
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/sessions/{sessionId}/kill:
    post:
      operationId: dbKillSession
      summary: Terminate a session or operation
      description: Requires control on the instance. Audited.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - name: sessionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: Terminated
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /db/{id}/dump:
    post:
      operationId: dbDump
      summary: Dump a database to a backup target
      description: Runs mysqldump/mongodump into the chosen backup target as a background job. Requires control on the database and view on backups. Audited; progress lands in the backup run history.
      tags: [databases]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [database, targetId]
              properties:
                database: { type: string }
                targetId: { type: string, format: uuid }
      responses:
        "202":
          $ref: "#/components/responses/JobQueued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /truenas/instances:
    get:
      operationId: truenasListInstances
      summary: All TrueNAS instances with live system info
      tags: [truenas]
      responses:
        "200":
          description: Visible instances
          content:
            application/json:
              schema:
                type: array
