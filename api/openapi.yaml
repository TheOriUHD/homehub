        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /signals:
    get:
      operationId: listSignals
      summary: The live global signal stream with severity counts
      tags: [signals]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: Live signals, newest activity first
          content:
            application/json:
              schema:
                type: object
                required: [items, counts]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Signal" }
                  counts: { $ref: "#/components/schemas/SignalCounts" }
  /signals/dismiss:
    post:
      operationId: dismissSignals
      summary: Dismiss one or more signals
      tags: [signals]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: How many live signals were dismissed
          content:
            application/json:
              schema:
                type: object
                required: [dismissed]
                properties:
                  dismissed: { type: integer, format: int64 }

  /folders:
    get:
      operationId: listFolders
      summary: The calling user's workspace folders
      tags: [files]
      responses:
        "200":
          description: Folders sorted by path
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkspaceFolder" }
    post:
      operationId: createFolder
      summary: Create a workspace folder
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: "Slash-joined path, e.g. \"photos\" or \"photos/2026\"" }
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceFolder" }
        "409":
          description: That folder already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /folders/{id}:
    delete:
      operationId: deleteFolder
      summary: Delete a folder, its subfolders, and every file inside
      tags: [files]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /convert/formats:
    get:
      operationId: convertFormats
      summary: The conversion catalog — formats, targets, and tool availability
      description: >
        The full conversion graph derived from the server's format matrix, each
        target annotated with whether the engine that services it is installed.
        The UI renders this and disables unavailable targets.
      tags: [convert]
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvertCatalog" }
  /convert:
    get:
      operationId: listConversions
      summary: The caller's recent (unexpired) conversion batches
      tags: [convert]
      responses:
        "200":
          description: Batches, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConvertBatch" }
    post:
      operationId: createConversion
      summary: Upload files and start a conversion batch
      description: >
        Multipart upload. `target` is the target format id; `options` is an
        optional JSON object (quality, crf). Each file's format is detected
        server-side; unsupported files come back as immediately-failed items.
      tags: [convert]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [target, files]
              properties:
                target: { type: string, description: Target format id }
                options: { type: string, description: JSON object of conversion options }
                files:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: The created batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvertBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /convert/{id}:
    get:
      operationId: getConversion
      summary: One conversion batch with its items
      tags: [convert]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConvertBatch" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteConversion
      summary: Delete a conversion batch and its working files
      tags: [convert]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /convert/{id}/download:
    get:
      operationId: downloadConversion
      summary: All successful outputs of a batch as a zip
      tags: [convert]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: A zip archive of the converted files
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
  /convert/{id}/items/{itemId}/download:
    get:
      operationId: downloadConversionItem
      summary: A single converted file
      tags: [convert]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The converted file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /assistant:
    get:
      operationId: getAssistant
      summary: Assistant availability and configuration
      tags: [assistant]
      responses:
        "200":
          description: Assistant state. keySet says whether an API key is stored (never the key).
          content:
            application/json:
              schema:
                type: object
                required: [enabled, provider, model, baseUrl, keySet, keysSet, canConfigure, providers]
                properties:
                  enabled: { type: boolean }
                  provider: { type: string }
                  model: { type: string }
                  baseUrl: { type: string }
                  keySet: { type: boolean }
                  keysSet:
                    type: array
                    description: Provider ids that have a stored API key — switching providers keeps each key sealed in its own slot.
                    items: { type: string }
                  canConfigure: { type: boolean }
                  autoBasic:
                    type: string
                    description: Auto's fast lane for providers with no catalog. Empty means the catalog's own lane.
                  autoAdvanced:
                    type: string
                    description: Auto's interpretation lane for providers with no catalog.
                  autoAvailable:
                    type: boolean
                    description: Whether Auto can route right now — it needs a model for both lanes.
                  notifyModel:
                    type: string
                    description: >-
                      The small model that writes push notifications. Empty means the
                      provider's basic Auto lane. Independent of the chat model: it runs
                      unattended, once per condition.
                  providers:
                    type: array
                    description: The selectable provider catalog with per-provider defaults.
                    items: { $ref: "#/components/schemas/AssistantProvider" }

  /telegram/settings:
    get:
      operationId: getTelegramSettings
      summary: Telegram bridge settings and linked chats
      tags: [assistant]
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramSettings" }
    put:
      operationId: putTelegramSettings
      summary: Update Telegram bridge settings
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                token: { type: string, description: "New bot token; omit to keep the stored one" }
      responses:
        "204": { description: Saved }
        "403": { $ref: "#/components/responses/Forbidden" }
  /telegram/notice-policy:
    get:
      operationId: getNoticePolicy
      summary: How monitored trouble reaches the phone
      tags: [telegram]
      responses:
        "200":
          description: The policy and where the queue stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticePolicyState" }
    put:
      operationId: putNoticePolicy
      summary: Change the notification policy
      description: Requires configure on settings. Times are HH:MM in the policy's time zone.
      tags: [telegram]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoticePolicy" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticePolicyState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /telegram/notice-policy/digest:
    post:
      operationId: sendNoticeDigest
      summary: Send the digest now
      description: Flushes everything waiting into one message, schedule or not. Requires configure on settings.
      tags: [telegram]
      responses:
        "200":
          description: What happened
          content:
            application/json:
              schema:
                type: object
                required: [sent, items]
                properties:
                  sent: { type: boolean, description: Whether a message went out (nothing waiting sends nothing) }
                  items: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /telegram/link-code:
    post:
      operationId: telegramLinkCode
      summary: Confirm a code the bot issued to a chat, linking that chat to the calling user
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Chat linked to the calling user
          content:
            application/json:
              schema:
                type: object
                required: [label]
                properties:
                  label: { type: string }
        "409":
          description: Bridge not running, code invalid, or rate-limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /telegram/chats/{chatId}:
    delete:
      operationId: telegramUnlinkChat
      summary: Unlink one Telegram chat
      tags: [assistant]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Unlinked }
        "403": { $ref: "#/components/responses/Forbidden" }
  /assistant/settings:
    put:
      operationId: putAssistantSettings
      summary: Configure the assistant
      description: Requires configure on system/settings. An empty apiKey keeps the stored one. Audited.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, provider, model]
              properties:
                enabled: { type: boolean }
                provider: { type: string, minLength: 1, maxLength: 40 }
                model: { type: string, minLength: 1, maxLength: 200 }
                baseUrl: { type: string, maxLength: 300 }
                apiKey: { type: string, maxLength: 512 }
                autoBasic:
                  type: string
                  maxLength: 200
                  description: Auto's fast lane. Only needed for providers with no built-in catalog.
                autoAdvanced:
                  type: string
                  maxLength: 200
                  description: Auto's interpretation lane. Only needed for providers with no built-in catalog.
                notifyModel:
                  type: string
                  maxLength: 200
                  description: The small model that writes push notifications. Empty restores the default.
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /assistant/discover:
    post:
      operationId: assistantDiscover
      summary: Scan attached networks for LM Studio instances
      description: Probes the host's directly attached /24 networks (and loopback) for LM Studio's unauthenticated /v1/models on port 1234. Requires configure on system/settings.
      tags: [assistant]
      responses:
        "200":
          description: Discovered instances (empty when none answered)
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances:
                    type: array
                    items:
                      type: object
                      required: [baseUrl, models]
                      properties:
                        baseUrl: { type: string }
                        models:
                          type: array
                          items: { type: string }
                        requiresKey:
                          type: boolean
                          description: The server answered but demands an API key.
        "403":
          $ref: "#/components/responses/Forbidden"

  /assistant/verify-endpoint:
    post:
      operationId: assistantVerifyEndpoint
      summary: Verify an OpenAI-compatible endpoint URL
      description: Asks the URL for its model list and reports what happened in actionable terms. Requires configure on system/settings.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseUrl]
              properties:
                baseUrl: { type: string, minLength: 1, maxLength: 300 }
                provider:
                  type: string
                  maxLength: 40
                  description: Use this provider's stored API key for the probe.
                apiKey:
                  type: string
                  maxLength: 512
                  description: Probe with this not-yet-saved key instead of the stored one. Never returned.
      responses:
        "200":
          description: Verification result — ok with models, or a diagnosis
          content:
            application/json:
              schema:
                type: object
                required: [ok, models]
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  models:
                    type: array
                    items: { type: string }
        "403":
          $ref: "#/components/responses/Forbidden"

  /assistant/chat:
    post:
      operationId: assistantChat
      summary: Send one message to the assistant
      description: Runs the tool loop under the caller's own permissions and returns the final reply. Audited with the tools used.
      tags: [assistant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: The assistant's reply
          content:
            application/json:
              schema:
                type: object
                required: [reply, tools]
                properties:
                  reply: { type: string }
                  tools:
                    type: array
                    items: { type: string }
                  steps:
                    type: array
                    description: Tool invocations this turn, inputs included — the UI builds action chips from these.
                    items: { $ref: "#/components/schemas/AssistantStep" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Assistant disabled or not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          $ref: "#/components/responses/UpstreamError"

  /assistant/history:
    get:
      operationId: getAssistantHistory
      summary: The caller's conversation history
      description: >-
        Web-channel history only — the Telegram bridge keeps a fully separate thread.
        Scoped to the given per-app-session conversation id. Returns EVERY branch of the
        conversation tree; parentId links each message to the one it follows, and the
        client walks one path through it (editing a question or retrying an answer
        creates a sibling branch).
      tags: [assistant]
      parameters:
        - name: conversation
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, role, content, ts]
                  properties:
                    id: { type: integer, format: int64 }
                    parentId:
                      type: integer
                      format: int64
                      nullable: true
                      description: The message this one follows; absent for a thread's first message.
                    role: { type: string, enum: [user, assistant] }
                    content: { type: string }
                    tools:
                      type: array
                      items: { type: string }
                    steps:
                      type: array
                      items: { $ref: "#/components/schemas/AssistantStep" }
                    usage: { $ref: "#/components/schemas/AssistantUsage" }
                    ts: { type: string, format: date-time }
    delete:
      operationId: clearAssistantHistory
      summary: Clear the caller's conversation
      tags: [assistant]
      responses:
        "204":
          description: Cleared

  /prefs/{key}:
    get:
      operationId: getUserPref
      summary: The caller's saved preference document for one surface
      tags: [account]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[a-z][a-z0-9-]*$" }
      responses:
        "200":
          description: The stored document, or null when never saved
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value:
                    type: object
                    additionalProperties: true
                    nullable: true
    put:
      operationId: putUserPref
      summary: Save the caller's preference document for one surface
      tags: [account]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64, pattern: "^[a-z][a-z0-9-]*$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: object
                  additionalProperties: true
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"

  /metrics/query:
    get:
      operationId: queryMetrics
      summary: Historical metric points for one resource metric
      description: Tier (raw, 5-minute, hourly) is chosen automatically from the time span.
      tags: [metrics]
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string }
        - name: metric
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Time-ordered points
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricQueryResult" }
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: homehub_session

  parameters:
    mcServerIdParam:
      name: serverId
      in: path
      required: true
      schema: { type: string, format: uuid }
    idParam:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    haEntityId:
      name: entityId
      in: path
      required: true
      description: Home Assistant entity id, e.g. light.kitchen
      schema: { type: string, pattern: "^[a-z0-9_]+\\.[a-z0-9_]+$" }
    dbNameParam:
      name: database
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    dbObjectParam:
      name: object
      in: path
      required: true
      description: Table name (SQL) or collection name (MongoDB)
      schema: { type: string, minLength: 1, maxLength: 128 }
    vmidParam:
      name: vmid
      in: path
      required: true
      schema: { type: integer }
    patchpilotHostIdParam:
      name: hostId
      in: path
      required: true
      schema: { type: string, format: uuid }
    containerName:
      name: name
      in: path
      required: true
      schema: { type: string }

  responses:
    SessionUser:
      description: Authenticated — session cookie set
      content:
        application/json:
          schema:
            type: object
            required: [user]
            properties:
              user: { $ref: "#/components/schemas/User" }
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated or credentials rejected
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: The upstream system rejected or failed the request; message carries its actual error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TaskStarted:
      description: The upstream accepted the operation as an asynchronous task
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PveTaskRef" }
    JobQueued:
      description: Queued as a background job; the outcome arrives as a notification
      content:
        application/json:
          schema:
            type: object
            required: [jobId]
            properties:
              jobId: { type: integer, format: int64 }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code
        message:
          type: string
          description: Human-readable explanation safe to display

    User:
      type: object
      required: [id, username, displayName, status, mustChangePassword, totpEnabled, passkeyCount, roleIds, hideSignals, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        email: { type: string, nullable: true }
        status: { type: string, enum: [active, disabled] }
        mustChangePassword: { type: boolean }
        hideSignals:
          type: boolean
          description: Per-user override that hides the signals surface for this account.
        totpEnabled: { type: boolean }
        passkeyCount: { type: integer }
        roleIds:
          type: array
          items: { type: string, format: uuid }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [overrides]
          properties:
            overrides:
              type: array
              items: { $ref: "#/components/schemas/Grant" }

    CreateUserResult:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
        inviteUrl:
          type: string
          nullable: true
          description: Present when onboarding is invite
        inviteExpiresAt: { type: string, format: date-time, nullable: true }
        tempPassword:
          type: string
          nullable: true
          description: Present when onboarding is temp_password — shown exactly once

    Grant:
      type: object
      required: [selector, levels, effect]
      properties:
        selector:
          type: string
          description: Resource path; matches the node and its subtree. '*' matches one segment.
        levels:
          type: array
          items: { type: string, enum: [view, control, configure, delete] }
        effect: { type: string, enum: [allow, deny] }

    GrantInput:
      type: object
      required: [selector, levels]
      properties:
        selector: { type: string, minLength: 1, maxLength: 512 }
        levels:
          type: array
          minItems: 1
          items: { type: string, enum: [view, control, configure, delete] }
        effect: { type: string, enum: [allow, deny], default: allow }

    Role:
      type: object
      required: [id, name, description, isSystem, hideSignals, memberCount, grants, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        isSystem: { type: boolean }
        hideSignals:
          type: boolean
          description: When true, members of this role do not see the signals surface (settable on built-in roles too).
        memberCount: { type: integer }
        grants:
          type: array
          items: { $ref: "#/components/schemas/Grant" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Me:
      type: object
      required: [user, grants, signalsHidden]
      properties:
        user: { $ref: "#/components/schemas/User" }
        grants:
          type: array
          description: Effective grants for UI presentation. The server re-checks every request regardless.
          items: { $ref: "#/components/schemas/Grant" }
        signalsHidden:
          type: boolean
          description: Effective signals visibility for this account (own override, or every role hides them). When true the client hides the signals bell, panel, and page.
        viewAsRoleId: { type: string, format: uuid, nullable: true }

    LoginResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, mfa_required]
        user:
          $ref: "#/components/schemas/User"
        mfaToken:
          type: string
          nullable: true
          description: Short-lived token to pass to the MFA completion endpoints
        methods:
          type: array
          items: { type: string, enum: [totp, passkey, recovery] }

    WebauthnChallenge:
      type: object
      required: [challengeToken, publicKey]
      properties:
        challengeToken:
          type: string
          description: Opaque token binding this challenge to the verify call
        publicKey:
          $ref: "#/components/schemas/WebauthnPayload"

    WebauthnPayload:
      type: object
      description: Opaque WebAuthn protocol payload, passed to and from the browser credential API unmodified
      additionalProperties: true

    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        transports:
          type: array
          items: { type: string }

    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }

    SessionInfo:
      type: object
      required: [id, createdAt, lastSeenAt, expiresAt, ip, userAgent, current]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        ip: { type: string }
        userAgent: { type: string }
        current: { type: boolean }

    AuditEntry:
      type: object
      required: [id, ts, actorKind, actorName, action, resource, outcome, ip]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        actorKind: { type: string, enum: [user, system, agent] }
        actorId: { type: string, format: uuid, nullable: true }
        actorName: { type: string }
        action: { type: string }
        resource: { type: string }
        outcome: { type: string, enum: [success, failure, denied] }
        ip: { type: string }
        detail:
          type: object
          additionalProperties: true

    Notification:
      type: object
      required: [id, ts, severity, title, body, resource, eventType, read]
      properties:
        id: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        severity: { type: string, enum: [info, success, warning, error] }
        title: { type: string }
        body: { type: string }
        resource: { type: string }
        eventType: { type: string }
        read: { type: boolean }

    HealthReport:
      type: object
      required: [version, uptimeSeconds, database, jobs, websocketClients, integrations]
      properties:
        version: { type: string }
        uptimeSeconds: { type: integer, format: int64 }
        database:
          type: object
          required: [reachable, sizeBytes, latencyMs]
          properties:
            reachable: { type: boolean }
            sizeBytes: { type: integer, format: int64 }
            latencyMs: { type: number }
        jobs:
          type: object
          required: [workers, active, pending, running, failedRecent]
          properties:
            workers: { type: integer }
            active: { type: integer }
            pending: { type: integer }
            running: { type: integer }
            failedRecent: { type: integer }
        websocketClients: { type: integer }
        integrations:
          type: array
          description: Health of every configured integration instance. Empty until integrations are added.
          items:
            type: object
            required: [id, type, name, status]
            properties:
              id: { type: string, format: uuid }
              type: { type: string }
              name: { type: string }
              status: { type: string, enum: [connected, degraded, unreachable] }
              lastError: { type: string, nullable: true }

    AssistantModel:
      type: object
      description: One entry in a provider's switch-on-the-fly model menu.
      required: [id, label, blurb]
      properties:
        id: { type: string }
        label: { type: string }
        blurb: { type: string }
        tier:
          type: string
          enum: [premium, ultra]
          description: Spend gate — premium confirms once, ultra confirms after a forced pause.
        costNote: { type: string, description: What the confirmation tells the user it costs. }
        autoLane:
          type: string
          enum: [basic, advanced]
          description: Which Auto lane this model serves for its provider.
        aliases:
          type: array
          items: { type: string }
          description: Other ids meaning this model, e.g. a pinned dated snapshot.

    AssistantProvider:
      type: object
      required: [id, label, kind, requiresKey, defaultModel]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string, enum: [cloud, local] }
        requiresKey: { type: boolean }
        defaultModel: { type: string }
        models:
          type: array
          description: >-
            The curated menu, cheapest first. Absent when the provider has no fixed
            catalog (local runtimes, OpenRouter), where the model stays free text.
          items: { $ref: "#/components/schemas/AssistantModel" }
        defaultBaseUrl: { type: string }
        modelHint: { type: string }

    AssistantUsage:
      type: object
      description: >-
        What producing one answer cost, summed across every round of that turn's
        tool loop. costUsd is an ESTIMATE from published list prices — cached
        input and promotional rates bill lower — and is absent for models with no
        known price.
      required: [model, inputTokens, outputTokens]
      properties:
        model: { type: string, description: The model id that produced the answer. }
        modelLabel: { type: string, description: Its display name, when it is a catalog model. }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        costUsd: { type: number, format: double }
        route:
          type: string
          description: >-
            The Auto rule that chose this model (e.g. "asks why"). Absent when the
            user pinned a model themselves.
        durationMs:
          type: integer
          format: int64
          description: Wall-clock time to produce the answer, across every model round and tool call.

    AssistantStep:
      type: object
      required: [tool]
      properties:
        tool: { type: string }
        input:
          type: object
          additionalProperties: true
        isError: { type: boolean }

    AppSettings:
      type: object
      required: [appUrl, sessionTtlHours, metricsRawRetentionHours, metrics5mRetentionDays, metrics1hRetentionDays]
      properties:
        appUrl:
          type: string
          description: External base URL, used for invite links and passkey origin validation
        sessionTtlHours: { type: integer }
        metricsRawRetentionHours: { type: integer }
        metrics5mRetentionDays: { type: integer }
        metrics1hRetentionDays: { type: integer }

    BackupTarget:
      type: object
      required: [id, type, name, config, retentionDays, encrypt, enabled, status, statusMessage]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [local, smb, nfs, s3] }
        name: { type: string }
        config:
          type: object
          additionalProperties: true
        retentionDays: { type: integer }
        encrypt: { type: boolean }
        enabled: { type: boolean }
        status: { type: string, enum: [unknown, ok, error] }
        statusMessage: { type: string }
        capacity:
          type: object
          nullable: true
          required: [unknown]
          properties:
            totalBytes: { type: integer, format: int64 }
            freeBytes: { type: integer, format: int64 }
            unknown: { type: boolean }

    BackupTargetInput:
      type: object
      required: [type, name, config]
      properties:
        type: { type: string, enum: [local, smb, nfs, s3] }
        name: { type: string, minLength: 1, maxLength: 128 }
        config:
          type: object
          additionalProperties: true
        secrets:
          type: object
          description: Only provided keys are replaced
          additionalProperties: { type: string }
        retentionDays: { type: integer, minimum: 1, maximum: 3650, default: 30 }
        encrypt: { type: boolean, default: false }
        enabled: { type: boolean, default: true }

    BackupArchive:
      type: object
      required: [path, sizeBytes, modTime, encrypted]
      properties:
        path: { type: string }
        sizeBytes: { type: integer, format: int64 }
        modTime: { type: string, format: date-time }
        encrypted: { type: boolean }

    BackupManifest:
      type: object
      required: [version, createdAt, kind, dumpFormat, encrypted]
      properties:
        version: { type: string }
        createdAt: { type: string, format: date-time }
        kind: { type: string }
        dumpFormat: { type: string }
        encrypted: { type: boolean }

    BackupRun:
      type: object
      required: [id, targetName, kind, status, filePath, sizeBytes, error, startedAt]
      properties:
        id: { type: integer, format: int64 }
        targetId: { type: string, format: uuid, nullable: true }
        targetName: { type: string }
        kind: { type: string, enum: [app-backup, restore, prune] }
        status: { type: string, enum: [running, succeeded, failed] }
        filePath: { type: string }
        sizeBytes: { type: integer, format: int64 }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }

    BackupSchedule:
      type: object
      required: [id, targetId, targetName, cron, enabled]
      properties:
        id: { type: string, format: uuid }
        targetId: { type: string, format: uuid }
        targetName: { type: string }
        cron: { type: string }
        enabled: { type: boolean }
        lastRunAt: { type: string, format: date-time, nullable: true }
        nextRunAt: { type: string, format: date-time, nullable: true }

    MetricSeriesInfo:
      type: object
      required: [resource, metric, unit]
      properties:
        resource: { type: string }
        metric: { type: string }
        unit: { type: string }
        lastSeen:
          type: string
          format: date-time
          nullable: true
          description: >-
            Newest recorded point, across raw samples and rollups. A series that
            stopped recording — a removed container, an entity that went quiet —
            keeps its row while its integration exists; absent means it never
            recorded anything.

    AlertRule:
      type: object
      required: [id, name, resource, metric, operator, threshold, sustainedSeconds, severity, enabled, state, stateChangedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        resource: { type: string }
        metric: { type: string }
        operator: { type: string, enum: [gt, lt] }
        threshold: { type: number }
        sustainedSeconds: { type: integer }
        severity: { type: string, enum: [info, warning, error] }
        enabled: { type: boolean }
        state: { type: string, enum: [ok, firing, unknown] }
        stateChangedAt: { type: string, format: date-time }

    AlertRuleInput:
      type: object
      required: [name, resource, metric, operator, threshold, sustainedSeconds, severity]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        resource: { type: string, minLength: 1 }
        metric: { type: string, minLength: 1 }
        operator: { type: string, enum: [gt, lt] }
        threshold: { type: number }
        sustainedSeconds: { type: integer, minimum: 30, maximum: 86400 }
        severity: { type: string, enum: [info, warning, error] }
        enabled: { type: boolean, default: true }

    Channel:
      type: object
      required: [id, type, name, config, enabled, secretNames]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [webhook, email, ntfy, gotify, telegram, discord] }
        name: { type: string }
        config:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        secretNames:
          type: array
          items: { type: string }

    ChannelInput:
      type: object
      required: [type, name, config]
      properties:
        type: { type: string, enum: [webhook, email, ntfy, gotify, telegram, discord] }
        name: { type: string, minLength: 1, maxLength: 128 }
        config:
          type: object
          additionalProperties: true
        secrets:
          type: object
          description: Only provided keys are replaced
          additionalProperties: { type: string }
        enabled: { type: boolean, default: true }

    ChannelRef:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }

    NotificationPrefs:
      type: object
      required: [eventTypes, prefs, channels]
      properties:
        eventTypes:
          type: array
          items: { type: string }
        prefs:
          type: array
          items:
            type: object
            required: [eventType, inapp, channelIds]
            properties:
              eventType: { type: string }
              inapp: { type: boolean }
              channelIds:
                type: array
                items: { type: string, format: uuid }
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelRef" }

    IntegrationType:
      type: object
      required: [id, name, description, secretNames]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        secretNames:
          type: array
          items: { type: string }

    Integration:
      type: object
      required: [id, type, name, config, enabled, status, statusMessage, statusChangedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        name: { type: string }
        config:
          type: object
          additionalProperties: true
        enabled: { type: boolean }
        status:
          type: string
          enum: [pending, connecting, connected, degraded, unreachable, disabled]
        statusMessage: { type: string }
        statusChangedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    TestConnectionResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        detail:
          type: object
          additionalProperties: true

    PveGuestAction:
      type: string
      enum: [start, stop, shutdown, reboot, suspend, resume]

    PveTaskRef:
      type: object
      required: [upid, node]
      properties:
        upid: { type: string }
        node: { type: string }

    PveSummary:
      type: object
      required: [clusterName, quorate, nodes, storageUsedBytes, storageTotalBytes]
      properties:
        clusterName: { type: string }
        quorate: { type: boolean, nullable: true }
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PveNode" }
        storageUsedBytes: { type: integer, format: int64 }
        storageTotalBytes: { type: integer, format: int64 }

    PveNode:
      type: object
      required: [name, status, cpu, maxCpu, memBytes, maxMemBytes, uptimeSeconds]
      properties:
        name: { type: string }
        status: { type: string }
        cpu:
          type: number
          description: Load as a 0..1 fraction of all cores
        maxCpu: { type: integer }
        memBytes: { type: integer, format: int64 }
        maxMemBytes: { type: integer, format: int64 }
        uptimeSeconds: { type: integer, format: int64 }
        pveVersion: { type: string }

    PveGuest:
      type: object
      required: [vmid, name, kind, node, status, cpu, maxCpu, memBytes, maxMemBytes, diskBytes, maxDiskBytes, uptimeSeconds, template]
      properties:
        vmid: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [qemu, lxc] }
        node: { type: string }
        status: { type: string }
        cpu: { type: number }
        maxCpu: { type: integer }
        memBytes: { type: integer, format: int64 }
        maxMemBytes: { type: integer, format: int64 }
        diskBytes: { type: integer, format: int64 }
        maxDiskBytes: { type: integer, format: int64 }
        uptimeSeconds: { type: integer, format: int64 }
        template: { type: boolean }
        tags: { type: string }

    PveGuestDetail:
      type: object
      required: [guest, config]
      properties:
        guest: { $ref: "#/components/schemas/PveGuest" }
        config:
          type: object
          description: Raw Proxmox configuration keys as the API reports them
          additionalProperties: true

    PveSnapshot:
      type: object
      required: [name, description, vmstate]
      properties:
        name: { type: string }
        description: { type: string }
        snaptime: { type: string, format: date-time, nullable: true }
        vmstate: { type: boolean }

    PveGuestAgent:
      type: object
      required: [available, interfaces]
      properties:
        available: { type: boolean }
        reason:
          type: string
          description: Why the agent is unavailable, when it is
        hostname: { type: string }
        os: { type: string }
        interfaces:
          type: array
          items:
            type: object
            required: [name, addresses]
            properties:
              name: { type: string }
              mac: { type: string }
              addresses:
                type: array
                items:
                  type: object
                  required: [address, type]
                  properties:
                    address: { type: string }
                    type: { type: string, enum: [ipv4, ipv6] }
                    prefix: { type: integer }

    PveTask:
      type: object
      required: [upid, node, type, id, user, running, startTime]
      properties:
        upid: { type: string }
        node: { type: string }
        type: { type: string }
        id: { type: string }
        user: { type: string }
        running: { type: boolean }
        exitStatus: { type: string, nullable: true }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time, nullable: true }

    PveTaskDetail:
      type: object
      required: [task, lines]
      properties:
        task: { $ref: "#/components/schemas/PveTask" }
        lines:
          type: array
          items: { type: string }

    PveStorage:
      type: object
      required: [storage, node, type, content, active, usedBytes, totalBytes]
      properties:
        storage: { type: string }
        node: { type: string }
        type: { type: string }
        content: { type: string }
        active: { type: boolean }
        usedBytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }

    PveBackupJob:
      type: object
      required: [id, schedule, storage, mode, enabled, vmids]
      properties:
        id: { type: string }
        schedule: { type: string }
        storage: { type: string }
        mode: { type: string }
        enabled: { type: boolean }
        vmids:
          type: string
          description: Comma-separated vmid list, or empty for all

    PveBackupJobSpec:
      type: object
      required: [schedule, storage, vmids]
      properties:
        schedule:
          type: string
          description: Proxmox calendar event, e.g. "02:30" or "sat 03:00"
        storage: { type: string }
        mode: { type: string, enum: [snapshot, suspend, stop], default: snapshot }
        enabled: { type: boolean, default: true }
        vmids: { type: string }

    PveBulkResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [vmid]
            properties:
              vmid: { type: integer }
              upid: { type: string, nullable: true }
              error: { type: string, nullable: true }

    TermSession:
      type: object
      required: [sessionId, wsPath]
      properties:
        sessionId: { type: string }
        wsPath:
          type: string
          description: One-time WebSocket path, valid for 30 seconds
        credential:
          type: string
          nullable: true
          description: For VNC sessions, the one-time password noVNC must answer RFB authentication with

    SSHCredentialInfo:
      type: object
      required: [resource, host, port, username, authType, updatedAt]
      properties:
        resource: { type: string }
        host: { type: string }
        port: { type: integer }
        username: { type: string }
        authType: { type: string, enum: [password, key] }
        hostId:
          type: string
          format: uuid
          nullable: true
          description: The central SSH host this resource is bound to, when any
        hostName: { type: string, description: That host's display name }
        updatedAt: { type: string, format: date-time }

    SSHHost:
      type: object
      required: [id, name, hostname, port, username, authType, notes, inUse, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        hostname: { type: string }
        port: { type: integer }
        username: { type: string }
        authType: { type: string, enum: [password, key] }
        notes: { type: string }
        inUse:
          type: integer
          description: How many resources are bound to this host
        boundResources:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SSHHostInput:
      type: object
      required: [name, hostname, username, authType]
      properties:
        name: { type: string, minLength: 1, description: Display name, unique }
        hostname: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }
        username: { type: string, minLength: 1 }
        authType: { type: string, enum: [password, key] }
        secret:
          type: string
          description: Password or PEM private key; omit on update to keep the stored one
        notes: { type: string }

    SSHKnownHost:
      type: object
      required: [host, port, fingerprint, updatedAt, usedBy]
      properties:
        host: { type: string }
        port: { type: integer }
        fingerprint: { type: string }
        updatedAt: { type: string, format: date-time }
        usedBy:
          type: array
          description: Names of the registry entries and systems that connect to this address
          items: { type: string }

    SSHHostKeyRef:
      type: object
      required: [host]
      properties:
        host: { type: string, minLength: 1 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 22 }

    SSHHostKeyCheck:
      type: object
      required: [host, port, status]
      properties:
        host: { type: string }
        port: { type: integer }
        status:
          type: string
          enum: [match, changed, unpinned, unreachable]
          description: >
            match — the pin still holds. changed — the machine answers with a
            different key, so every connection to it is refused until this is
            resolved. unpinned — nothing pinned yet; the next connection pins
            what it sees. unreachable — the address did not answer.
        pinned: { type: string, description: The fingerprint on record, absent when nothing is pinned }
        observed: { type: string, description: What the machine is presenting now, absent when unreachable }
        message: { type: string }
        alsoStale:
          type: array
          description: >
            PatchPilot hosts at this address whose own pin no longer matches
            either. PatchPilot pins per managed host, so its update runs stay
            blocked until the same key is accepted for them; trusting here does
            that too, and this names who it covers.
          items: { type: string }

    DockerContainer:
      type: object
      required: [id, name, image, state, status, created]
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: string }
        imageId: { type: string }
        state: { type: string }
        status: { type: string }
        created: { type: string, format: date-time }
        composeProject: { type: string, nullable: true }
        composeService: { type: string, nullable: true }
        ports:
          type: array
          items:
            type: object
            required: [private, type]
            properties:
              private: { type: integer }
              public: { type: integer, nullable: true }
              type: { type: string }

    DockerContainerDetail:
      type: object
      required: [container, env, mounts, networks, labels, cmd]
      properties:
        container: { $ref: "#/components/schemas/DockerContainer" }
        env:
          type: array
          items: { type: string }
        mounts:
          type: array
          items:
            type: object
            required: [type, destination, rw]
            properties:
              type: { type: string }
              source: { type: string }
              destination: { type: string }
              rw: { type: boolean }
        networks:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              ipAddress: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        restartPolicy: { type: string }
        cmd: { type: string }
        entrypoint: { type: string }
        startedAt: { type: string, format: date-time, nullable: true }
        exitCode: { type: integer, nullable: true }

    DockerImage:
      type: object
      required: [id, tags, sizeBytes, created, dangling, inUse]
      properties:
        id: { type: string }
        tags:
          type: array
          items: { type: string }
        sizeBytes: { type: integer, format: int64 }
        created: { type: string, format: date-time }
        dangling: { type: boolean }
        inUse: { type: boolean }

    DockerUpdateCheck:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [reference, updateAvailable]
            properties:
              reference: { type: string }
