      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/vmidParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newid]
              properties:
                newid: { type: integer }
                name: { type: string }
                full: { type: boolean, default: false }
                target: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/TaskStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /proxmox/{id}/guests/{vmid}/snapshots:
    get:
      operationId: pveListSnapshots
      summary: List snapshots
      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/vmidParam"
      responses:
        "200":
          description: Snapshots, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PveSnapshot" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"
    post:
      operationId: pveCreateSnapshot
      summary: Take a snapshot
      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/vmidParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, pattern: "^[A-Za-z0-9_][A-Za-z0-9_-]*$", maxLength: 40 }
                description: { type: string, maxLength: 512 }
                vmstate: { type: boolean, default: false }
      responses:
        "200":
          $ref: "#/components/responses/TaskStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /proxmox/{id}/guests/{vmid}/snapshots/{name}:
    delete:
      operationId: pveDeleteSnapshot
      summary: Delete a snapshot
      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/vmidParam"
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/TaskStarted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /proxmox/{id}/guests/{vmid}/snapshots/{name}/rollback:
    post:
      operationId: pveRollbackSnapshot
      summary: Roll back to a snapshot
      description: The guest's current state is replaced by the snapshot. This cannot be undone.
      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/vmidParam"
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/TaskStarted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /proxmox/{id}/guests/{vmid}/backup:
    post:
      operationId: pveBackupGuest
      summary: Back up a guest now (vzdump)
      tags: [proxmox]
      parameters:
        - $ref: "#/components/parameters/idParam"
        - $ref: "#/components/parameters/vmidParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storage]
              properties:
                storage: { type: string }
                mode: { type: string, enum: [snapshot, suspend, stop], default: snapshot }
                compress: { type: string, enum: [zstd, gzip, lzo, "0"], default: zstd }
      responses:
        "200":
          $ref: "#/components/responses/TaskStarted"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamError"

  /proxmox/{id}/guests/{vmid}/console:
